<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程日程</title><style>
:root{font:14px system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--muted:var(--ui-muted)}*{box-sizing:border-box}body{margin:0;padding:20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.6}.muted,small{color:var(--muted)}small{display:block;margin-top:5px;white-space:pre-wrap}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}button,input,select,textarea{font:inherit;color:inherit;min-height:42px;border:1px solid var(--ui-line);border-radius:7px;background:var(--ui-field);padding:8px 11px}button{cursor:pointer;background:var(--ui-accent-soft)}button.primary{background:var(--ui-accent);color:#061527;font-weight:700}button:disabled{opacity:.45;cursor:wait}button.danger{color:var(--ui-danger)}label{display:grid;gap:6px}input[type=checkbox]{min-height:22px;min-width:22px}textarea{resize:vertical;min-height:85px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--ui-surface);padding:18px;margin:16px 0}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.weekday{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}.lesson{border-top:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.lesson strong{display:block}.lesson .toolbar{gap:6px;margin-bottom:0}.lesson button{padding:6px;min-height:36px}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid>*{min-width:0}.wide{grid-column:1/-1}fieldset{border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-wrap:wrap;gap:12px}fieldset label{display:flex;align-items:center;gap:5px}#message{min-height:24px;color:var(--ui-success);white-space:pre-wrap}#message.error{color:var(--ui-danger)}.hidden{display:none!important}.occurrence{border-top:1px solid var(--line);padding:14px 0;overflow-wrap:anywhere}.occurrence:first-child{border-top:0}.badge{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:20px}.pending{color:var(--ui-warning)}#syncStatus{white-space:pre-wrap}input,select,textarea{max-width:100%}
@media(max-width:1100px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:12px}.split,.formgrid,.week{grid-template-columns:1fr}.panel{padding:14px}.wide{grid-column:auto}button,input,select,textarea{font-size:16px}.toolbar>select{width:100%}.weekday{padding:14px}}

<style>
.ui-agenda .agenda-device label{white-space:nowrap;flex:0 1 360px}.ui-agenda .agenda-device #deviceSelect{min-width:0;flex:1;width:0}
.ui-agenda .week-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:12px 0}.ui-agenda .week-table th,.ui-agenda .week-table td{text-align:left;vertical-align:top;padding:12px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.ui-agenda .week-table th:nth-child(1){width:16%}.ui-agenda .week-table th:nth-child(2){width:23%}.ui-agenda .week-table th:nth-child(3){width:39%}.ui-agenda .week-table th:nth-child(4){width:22%}.ui-agenda .week-table tbody{border-top:2px solid var(--line)}.ui-agenda .week-table tbody.weekday{background:var(--ui-surface)}.ui-agenda .week-table .day-cell{background:#f7f9fc;font-weight:650}.ui-agenda .week-table small{font-size:12px;line-height:1.6}.ui-agenda .course-row{cursor:pointer}.ui-agenda .course-row:hover{background:var(--ui-accent-soft)}.ui-agenda .course-content strong{white-space:pre-wrap}.ui-agenda .week-table .course-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ui-agenda .course-actions label{display:flex;gap:6px;align-items:center;min-height:36px}.ui-agenda .week-table button{padding:7px 10px;min-height:36px;font-size:12px}.ui-agenda .week-table .add-course{background:transparent;border:1px dashed #b6cae8;color:var(--ui-accent);text-align:left}.ui-agenda #weekRange{font-size:13px}.ui-agenda .week-navigation{gap:8px}.ui-agenda .week-table .course-time{font-variant-numeric:tabular-nums}.ui-agenda .week-table .course-time span{display:inline-block}

</style></head><body class="ui-page ui-agenda"><div class="page-heading"><div class="eyebrow">WEEKLY PLANNER · 每周安排</div><h1>课程日程</h1><p class="muted">每周课程由服务器生成日期任务；已开始与已完成的记录保留。重叠课程分别显示，逾期任务需要手动处理。</p></div><div class="toolbar agenda-device"><label>设备 <select id="deviceSelect" aria-label="设备"></select></label><button id="refresh">刷新</button><span id="syncStatus" role="status"></span></div><p id="message" role="status" aria-live="polite"></p><div id="management" class="hidden">
<section class="panel"><h2>每周课程</h2><p id="window" class="muted"></p><div class="toolbar week-navigation"><button id="prevWeek" aria-label="上一周">← 上一周</button><button id="thisWeek">本周</button><button id="nextWeek" aria-label="下一周">下一周 →</button><strong id="weekRange"></strong></div><table id="week" class="week-table" aria-label="每周课程表"></table></section>
<div class="split"><section class="panel"><h2 id="formTitle">添加课程</h2><form id="ruleForm"><div class="formgrid"><label class="wide">学习内容<input id="ruleTitle" required maxlength="80"></label><label class="wide">备注（可选）<textarea id="ruleNotes" maxlength="500"></textarea></label><fieldset class="wide" id="weekdays"><legend>每周上课日</legend></fieldset><label>开始时间<input id="startTime" type="time" required value="09:00"></label><label>结束时间<input id="endTime" type="time" required value="10:00"></label><label>开始日期<input id="validFrom" type="date"></label><label>结束日期（可留空）<input id="validUntil" type="date"></label></div><div class="toolbar"><button id="saveRule" class="primary">保存课程</button><button id="newRule" type="button">新增 / 清空</button><button id="deleteRule" type="button" class="danger hidden">删除课程</button></div><p id="formStatus" class="muted"></p></form></section>
<section class="panel"><h2>按日期查看</h2><div class="toolbar"><label>日期<input id="dayDate" type="date"></label><button id="loadDay">查看</button></div><p id="dayTotal" class="muted"></p><div id="dayRows"></div><button id="moreDay" class="hidden">加载更多</button></section></div>
<section class="panel"><h2>逾期未完成</h2><p class="muted">时间经过不会自动完成课程。单次重新打开会保留，之后修改每周课程仍会调整尚未开始的未完成任务。</p><p id="overdueTotal" class="muted"></p><div id="overdueRows"></div><button id="moreOverdue" class="hidden">加载更多</button></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id),days=['周一','周二','周三','周四','周五','周六','周日'];
let selected='',selectionGeneration=0,editGeneration=0,stateGeneration=0,dayGeneration=0,overdueGeneration=0,saveGeneration=0,activeSave=0,editing=null,state=null,dayCursor=null,overdueCursor=null,deviceListGeneration=0,weekGeneration=0,weekStart='',weekRows=[];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'';}
function isCurrent(id,generation){return id===selected&&generation===selectionGeneration;}
function path(id=selected){if(!id)throw Error('请先选择设备');return '/api/android/devices/'+encodeURIComponent(id)+'/schedule';}
function json(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};}
async function api(url,options={}){const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+(localStorage.getItem('devControlToken')||''));const response=await fetch(url,{...options,headers,redirect:'error'});const data=await response.json();if(!response.ok){const e=Error(response.status===401?'登录已过期，请返回控制台登录':data.error||'请求失败');e.status=response.status;throw e;}return data;}
async function run(action){const generation=selectionGeneration;try{await action();}catch(e){if(generation===selectionGeneration)message(e.message,true);}}
function dateIn(zone){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-');}
function minutes(value){const [h,m]=value.split(':').map(Number);return h*60+m;}
function timeText(value){return String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');}
function resetForm(){editing=null;editGeneration++;$('ruleForm').reset();for(const c of $('weekdays').querySelectorAll('input'))c.checked=false;$('validFrom').value=state?dateIn(state.timezone):'';$('formTitle').textContent='添加课程';$('formStatus').textContent='';$('deleteRule').classList.add('hidden');}
function select(id){if(selected===id)return false;selected=id;selectionGeneration++;stateGeneration++;dayGeneration++;overdueGeneration++;activeSave=0;state=null;weekGeneration++;weekStart='';weekRows=[];dayCursor=overdueCursor=null;$('saveRule').disabled=false;$('deleteRule').disabled=false;$('week').replaceChildren();$('dayRows').replaceChildren();$('overdueRows').replaceChildren();$('dayTotal').textContent='';$('overdueTotal').textContent='';$('dayDate').value='';$('syncStatus').textContent='';$('window').textContent='';$('weekRange').textContent='';$('moreDay').classList.add('hidden');$('moreOverdue').classList.add('hidden');message('');resetForm();$('management').classList.toggle('hidden',!id);return true;}
async function listDevices(){const request=++deviceListGeneration,generation=selectionGeneration;const data=await api('/api/android/devices');if(request!==deviceListGeneration||generation!==selectionGeneration)return;const old=selected;$('deviceSelect').replaceChildren();for(const d of data.devices){const option=node('option',d.name+' · #'+d.id+(d.online?' · 在线':' · 离线'));option.value=String(d.id);$('deviceSelect').append(option);}const id=data.devices.some(d=>String(d.id)===old)?old:(data.devices.length?String(data.devices[0].id):'');const changed=select(id);$('deviceSelect').value=id;if(!id){message('暂无配对设备。请先在「Android 桌面」配对平板。');return;}await refresh(changed);}
async function loadState(){const id=selected,generation=selectionGeneration,request=++stateGeneration;const data=await api(path(id));if(!isCurrent(id,generation)||request!==stateGeneration)return false;state=data;$('syncStatus').textContent=(data.ack_revision===data.revision?'已同步':'等待设备同步')+' · 版本 '+data.revision+(data.ack_at?' · 上次确认 '+new Date(data.ack_at*1000).toLocaleString():' · 尚未确认');$('syncStatus').className='badge'+(data.ack_revision===data.revision?'':' pending');$('window').textContent='时区 '+data.timezone+' · 平板离线缓存至 '+data.through_date+' · 服务器保留历史记录';if(!weekStart)weekStart=monday(dateIn(data.timezone));if(!$('dayDate').value)$('dayDate').value=dateIn(data.timezone);if(!$('validFrom').value&&!editing)$('validFrom').value=dateIn(data.timezone);renderWeek();return true;}
async function refresh(changed=false){const id=selected,generation=selectionGeneration;if(await loadState()&&isCurrent(id,generation))await Promise.all([loadWeek(),loadOccurrences('day'),loadOccurrences('overdue')]);}
function editRule(rule,generation){if(generation!==selectionGeneration)return;editing={id:rule.id,version:rule.version};editGeneration++;$('formTitle').textContent='编辑课程';$('ruleTitle').value=rule.title;$('ruleNotes').value=rule.notes;$('startTime').value=timeText(rule.start_minute);$('endTime').value=timeText(rule.end_minute);$('validFrom').value=rule.valid_from;$('validUntil').value=rule.valid_until||'';for(const c of $('weekdays').querySelectorAll('input'))c.checked=rule.weekdays.includes(Number(c.value));$('deleteRule').classList.remove('hidden');$('formStatus').textContent='课程版本 '+rule.version+'；保存调整未来未开始的任务，已开始与已完成的历史保留';$('ruleForm').scrollIntoView({block:'nearest',behavior:'smooth'});}
function addDate(value,offset){const d=new Date(value+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);}
function monday(value){const day=new Date(value+'T12:00:00Z').getUTCDay();return addDate(value,-((day+6)%7));}
function addCourse(weekday,day,id,generation){if(!isCurrent(id,generation))return;resetForm();$('weekdays').querySelector('input[value="'+weekday+'"]').checked=true;if(day>dateIn(state.timezone))$('validFrom').value=day;$('ruleForm').scrollIntoView({block:'nearest',behavior:'smooth'});$('ruleTitle').focus({preventScroll:true});}
async function loadWeek(){
  const id=selected,generation=selectionGeneration,start=weekStart,request=++weekGeneration;
  if(!start)return;
  const lists=await Promise.all(Array.from({length:7},async(_,offset)=>{
    const rows=[];let after=null;
    do{const params=new URLSearchParams({date:addDate(start,offset)});if(after)params.set('after_id',after);
      const data=await api(path(id)+'/occurrences?'+params);rows.push(...data.occurrences);after=data.next_after;
      if(!isCurrent(id,generation)||request!==weekGeneration)return [];
    }while(after!==null);
    return rows;
  }));
  if(!isCurrent(id,generation)||request!==weekGeneration||start!==weekStart)return;
  weekRows=lists.flat();renderWeek();
}
async function saveOccurrence(row,status,id,generation){
  if(!isCurrent(id,generation))return;
  await api(path(id)+'/occurrences/'+row.id,json('PUT',{status,expected_version:row.version}));
  if(!isCurrent(id,generation))return;
  message('任务已保存，等待设备确认同步。');await refresh();
}
function occurrenceTime(row,key){return new Intl.DateTimeFormat('en-GB',{timeZone:row.timezone,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(row[key]));}
function renderWeek(){
  if(!state||!weekStart)return;
  const generation=selectionGeneration,id=selected,table=$('week'),head=node('thead'),header=node('tr');
  for(const title of ['星期 / 日期','时间','学习内容','完成 / 操作'])header.append(node('th',title));head.append(header);table.replaceChildren(head);
  $('weekRange').textContent=weekStart+' — '+addDate(weekStart,6);
  const ruleMap=new Map(state.rules.map(r=>[r.id,r]));
  for(let weekday=1;weekday<=7;weekday++){
    const day=addDate(weekStart,weekday-1),group=node('tbody',undefined,'weekday');group.dataset.date=day;
    const actual=weekRows.filter(r=>r.local_date===day),seen=new Set(actual.map(r=>r.rule_id));
    const courses=actual.map(row=>({row,rule:ruleMap.get(row.rule_id),start:occurrenceTime(row,'start_ms')}));
    for(const rule of state.rules){if(!seen.has(rule.id)&&rule.weekdays.includes(weekday)&&rule.valid_from<=day&&(!rule.valid_until||day<=rule.valid_until))courses.push({row:null,rule,start:timeText(rule.start_minute)});}
    courses.sort((a,b)=>a.start.localeCompare(b.start)||(a.rule?.id||a.row.rule_id)-(b.rule?.id||b.row.rule_id));
    const dayCell=node('td',undefined,'day-cell');dayCell.rowSpan=courses.length+1;dayCell.append(node('div',days[weekday-1]),node('small',day));
    for(const [index,course] of courses.entries()){
      const {row,rule}=course,tr=node('tr',undefined,'course-row'),time=node('td',undefined,'course-time'),content=node('td',undefined,'course-content'),actions=node('td'),controls=node('div',undefined,'course-actions');
      if(index===0)tr.append(dayCell);
      let start,end;
      if(row){start=course.start;end=occurrenceTime(row,'end_ms');}else{start=timeText(rule.start_minute);end=timeText(rule.end_minute);}
      time.append(node('span',start+'–'+end));if(row&&row.timezone!==state.timezone)time.append(node('small',row.timezone));
      content.append(node('strong',row?row.title:rule.title));if((row?row.notes:rule.notes))content.append(node('small',row?row.notes:rule.notes));
      if(row){const label=node('label'),check=document.createElement('input');check.type='checkbox';check.checked=row.status==='completed';check.disabled=row.status==='cancelled';check.setAttribute('aria-label',(row.title)+' '+day+' 完成');label.append(check,node('span',row.status==='cancelled'?'已取消':'完成'));check.onclick=e=>e.stopPropagation();check.onchange=()=>run(async()=>{check.disabled=true;try{await saveOccurrence(row,check.checked?'completed':'pending',id,generation);}catch(e){check.checked=row.status==='completed';throw e;}finally{if(isCurrent(id,generation))check.disabled=row.status==='cancelled';}});controls.append(label);}else controls.append(node('small','未生成任务'));
      if(rule){const edit=node('button','编辑');edit.type='button';edit.onclick=()=>editRule(rule,generation);controls.append(edit);tr.onclick=event=>{if(!event.target.closest('button,input,label'))editRule(rule,generation);};tr.tabIndex=0;tr.setAttribute('aria-label',day+' '+(row?row.title:rule.title)+'，编辑每周课程');tr.onkeydown=event=>{if(event.target===tr&&(event.key==='Enter'||event.key===' ')){event.preventDefault();editRule(rule,generation);}};}else{tr.classList.add('history-row');content.append(node('small','每周课程已删除；保留历史记录'));}
      actions.append(controls);tr.append(time,content,actions);group.append(tr);
    }
    const addRow=node('tr'),addCell=node('td'),add=node('button',courses.length?'＋ 添加课程':'＋ 添加课程（暂无安排）','add-course');
    if(!courses.length)addRow.append(dayCell);addCell.colSpan=3;add.type='button';add.onclick=()=>addCourse(weekday,day,id,generation);addCell.append(add);addRow.append(addCell);group.append(addRow);table.append(group);
  }
}
async function loadOccurrences(kind,more=false){const id=selected,generation=selectionGeneration,isDay=kind==='day',request=isDay?++dayGeneration:++overdueGeneration;const day=$('dayDate').value,cursor=more?(isDay?dayCursor:overdueCursor):null;const params=new URLSearchParams(isDay?{date:day}:{overdue:'1'});if(cursor)params.set('after_id',cursor);const data=await api(path(id)+'/occurrences?'+params);if(!isCurrent(id,generation)||(isDay?request!==dayGeneration||day!==$('dayDate').value:request!==overdueGeneration))return;const rows=$(kind+'Rows');if(!more)rows.replaceChildren();for(const occurrence of data.occurrences)rows.append(occurrenceRow(occurrence,id,generation));if(!rows.children.length)rows.append(node('p',isDay?'该日期暂无课程任务':'暂无逾期未完成任务','muted'));$(kind+'Total').textContent='共 '+data.total_count+' 项'+(data.next_after?' · 下方可加载更多':'');if(isDay)dayCursor=data.next_after;else overdueCursor=data.next_after;$(isDay?'moreDay':'moreOverdue').classList.toggle('hidden',data.next_after===null);}
function occurrenceRow(row,id,generation){const box=node('article',undefined,'occurrence'),format=new Intl.DateTimeFormat('zh-CN',{timeZone:row.timezone,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});box.append(node('strong',row.title),node('small',row.local_date+' · '+format.format(new Date(row.start_ms))+'–'+format.format(new Date(row.end_ms))+' · '+row.timezone),node('small',row.notes),node('small',{pending:'未完成',completed:'已完成',cancelled:'已取消'}[row.status]+' · 版本 '+row.version));const actions=node('div',undefined,'toolbar');for(const [status,label] of [['completed','完成'],['pending','重新打开'],['cancelled','取消本次']]){if(row.status===status)continue;const button=node('button',label,status==='cancelled'?'danger':'');button.onclick=()=>run(async()=>{if(!isCurrent(id,generation))return;button.disabled=true;try{await api(path(id)+'/occurrences/'+row.id,json('PUT',{status,expected_version:row.version}));if(!isCurrent(id,generation))return;message('任务已保存，等待设备确认同步。');await refresh();}finally{if(isCurrent(id,generation))button.disabled=false;}});actions.append(button);}box.append(actions);return box;}
for(let i=1;i<=7;i++){const label=node('label'),input=document.createElement('input');input.type='checkbox';input.value=String(i);input.setAttribute('aria-label',days[i-1]);label.append(input,node('span',days[i-1]));$('weekdays').append(label);}
$('ruleForm').addEventListener('input',()=>{editGeneration++;$('formStatus').textContent='有未保存更改';});
$('ruleForm').onsubmit=async event=>{event.preventDefault();const id=selected,generation=selectionGeneration,edit=editGeneration,rule=editing?{...editing}:null,request=++saveGeneration;if(!id||!state)return;const body={title:$('ruleTitle').value,notes:$('ruleNotes').value,weekdays:[...$('weekdays').querySelectorAll('input:checked')].map(c=>Number(c.value)),start_minute:minutes($('startTime').value),end_minute:minutes($('endTime').value),valid_from:$('validFrom').value||null,valid_until:$('validUntil').value||null};if(rule)body.expected_version=rule.version;activeSave=request;$('saveRule').disabled=true;const current=()=>isCurrent(id,generation)&&activeSave===request;try{const data=await api(path(id)+'/rules'+(rule?'/'+rule.id:''),json(rule?'PUT':'POST',body));if(!current())return;if(edit===editGeneration){resetForm();$('formStatus').textContent='已保存课程版本 '+data.rule.version;}else{if(editing&&rule&&editing.id===rule.id)editing.version=data.rule.version;$('formStatus').textContent='提交的课程已保存；表单仍有未保存更改';}message('课程已保存，等待设备确认同步。');await refresh();}catch(e){if(current())message(e.message+(e.status===409?'；请点击刷新并重新选择课程。':''),true);}finally{if(current()){activeSave=0;$('saveRule').disabled=false;}}};
$('deleteRule').onclick=()=>run(async()=>{const id=selected,generation=selectionGeneration,rule=editing?{...editing}:null;if(!rule)return;const button=$('deleteRule');button.disabled=true;try{await api(path(id)+'/rules/'+rule.id,json('DELETE',{expected_version:rule.version}));if(!isCurrent(id,generation))return;if(editing?.id===rule.id)resetForm();message('课程已删除；已开始与已完成的记录保留。');await refresh();}finally{if(isCurrent(id,generation))button.disabled=false;}});
function moveWeek(offset){if(!state)return;weekStart=offset===null?monday(dateIn(state.timezone)):addDate(weekStart,offset);weekRows=[];renderWeek();run(loadWeek);}
$('prevWeek').onclick=()=>moveWeek(-7);$('nextWeek').onclick=()=>moveWeek(7);$('thisWeek').onclick=()=>moveWeek(null);
