<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务器自更新</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--blue:var(--ui-accent)}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 85% 0,var(--ui-accent-soft),transparent 35%),var(--ui-canvas)}button,input{font:inherit}.wrap{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.version{padding:7px 11px;border-radius:15px;background:var(--ui-accent-soft);color:var(--ui-accent)}.upload{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}label{display:grid;gap:5px;color:var(--ui-muted)}input{padding:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.btn{padding:10px 13px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer}.danger{background:var(--ui-danger);color:var(--ui-text)}.ghost{border:1px solid var(--line);background:transparent;color:var(--ui-text)}.card{margin:12px 0;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.cardhead{display:flex;justify-content:space-between;gap:15px}.muted{color:var(--ui-muted)}.counts{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{padding:4px 8px;border-radius:12px;background:var(--ui-accent-soft)}.files{max-height:220px;overflow:auto;padding:9px;background:var(--ui-field);border-radius:8px;font-family:monospace;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.ok{color:var(--ui-success)}.bad{color:var(--ui-danger)}.notice{min-height:22px}@media(max-width:700px){body{padding:14px}h1{font-size:22px}.upload,.cardhead,.actions{flex-direction:column;align-items:stretch}.btn{min-height:40px}}</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-updates"><div class="wrap"><header class="top"><div><h1>服务器自更新</h1><div class="muted">上传、对比、确认应用、版本历史和回滚</div></div><div class="version">当前版本：<strong id="current">-</strong></div></header><form id="upload" class="upload"><label>版本号（根据文件名自动获取）<input id="version" readonly placeholder="选择更新包后自动显示"></label><label>更新包<input id="file" required type="file" accept=".gz,application/gzip"></label><button class="btn">上传并检查</button></form><div id="notice" class="notice"></div><section id="updates"></section></div><script>
const $=s=>document.querySelector(s),H=()=>({Authorization:'Bearer '+(localStorage.getItem('devControlToken')||'')});async function api(url,opt={}){opt.headers=Object.assign(H(),opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let d=await api('/api/updates');$('#current').textContent=d.current_version;$('#updates').innerHTML=d.updates.map(x=>{let diff=x.diff||{},summary=['added','modified','unchanged','deleted'].map(k=>`<span class="pill">${k}: ${(diff[k]||[]).length}</span>`).join(''),files=[...(diff.added||[]).map(v=>'+ '+v.path),...(diff.modified||[]).map(v=>'~ '+v.path),...(diff.deleted||[]).map(v=>'- '+v.path)];return `<article class="card"><div class="cardhead"><div><h3>${esc(x.version)}</h3><div class="muted">#${x.id} · ${new Date(x.created_at*1000).toLocaleString()}</div></div><strong class="${x.status==='applied'?'ok':x.status==='rolled_back'?'bad':''}">${x.status}</strong></div><div class="counts">${summary}</div><div class="files">${files.map(esc).join('<br>')||'没有文件变化'}</div><div class="actions">${x.status==='staged'?`<button class="btn" onclick="applyUpdate(${x.id})">确认应用并重启</button>`:''}${x.status==='applied'?`<button class="btn danger" onclick="rollback(${x.id})">回滚此版本</button>`:''}</div></article>`}).join('')||'<p class="muted">暂无更新历史</p>'}
function filenameVersion(name){let stem=(name||'').replace(/\.tar\.gz$/i,'').replace(/^(simple-server-|server-|update-)/i,'');let m=stem.match(/^v?(\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z][0-9A-Za-z.-]*)?)$/);return m?m[1]:''}$('#file').onchange=e=>{$('#version').value=filenameVersion(e.target.files[0]?.name||'');if(e.target.files[0]&&!$('#version').value)notice('无法识别版本号，请使用 simple-server-1.2.3.tar.gz 格式',false)};$('#upload').onsubmit=async e=>{e.preventDefault();let form=new FormData();form.append('file',$('#file').files[0]);notice('正在上传、校验并比较文件…',true);try{let d=await api('/api/updates/upload',{method:'POST',body:form});notice(`检查完成：新增 ${d.summary.added}，修改 ${d.summary.modified}，不变 ${d.summary.unchanged}`,true);e.target.reset();load()}catch(x){notice(x.message,false)}};async function applyUpdate(id){if(!confirm('将备份并覆盖服务器代码，随后自动重启。确定继续？'))return;notice('正在应用更新，服务即将重启…',true);try{await api(`/api/updates/${id}/apply`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"restart":true}'});setTimeout(()=>location.reload(),4000)}catch(e){notice(e.message,false)}}async function rollback(id){if(!confirm('确定恢复该版本应用前的文件并重启？'))return;await api(`/api/updates/${id}/rollback`,{method:'POST'});setTimeout(()=>location.reload(),4000)}function notice(s,ok){$('#notice').textContent=s;$('#notice').className='notice '+(ok?'ok':'bad')}load().catch(e=>notice(e.message,false));
</script></body></html>
