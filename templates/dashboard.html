<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Control Server</title>
<style>
:root{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ui-text);background:var(--ui-canvas)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,var(--ui-accent-soft) 0,transparent 32%),var(--ui-canvas)}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(420px,100%);padding:34px;border:1px solid var(--ui-line);border-radius:18px;background:var(--ui-surface);box-shadow:0 24px 70px rgb(28 50 80 / 8%);backdrop-filter:blur(12px)}h1{margin:0 0 8px;font-size:28px}.muted{color:var(--ui-muted)}.field{display:grid;gap:7px;margin:18px 0}.field input{width:100%;padding:12px 14px;border:1px solid var(--ui-line);border-radius:9px;color:var(--ui-text);background:var(--ui-field);outline:none}.primary{width:100%;padding:12px;border:0;border-radius:9px;background:var(--ui-accent);color:#06101d;font-weight:700;cursor:pointer}.error{min-height:22px;color:var(--ui-danger);margin-top:12px}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.top button{padding:9px 15px;border:1px solid var(--ui-line);border-radius:8px;background:transparent;color:var(--ui-text);cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{display:block;min-height:166px;padding:22px;border:1px solid var(--ui-line);border-radius:14px;background:var(--ui-surface);color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-3px);border-color:var(--ui-accent);background:var(--ui-accent-soft)}.icon{font-size:30px}.card h2{margin:18px 0 7px;font-size:18px}.status{margin-top:28px;padding:18px;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-surface)}.row{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:20px;background:var(--ui-accent-soft);color:var(--ui-accent);font-size:12px}@media(max-width:600px){.shell{padding:20px}.top{align-items:flex-start}.panel{padding:25px}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-dashboard">
<main id="login" class="login"><form id="loginForm" class="panel"><h1>Dev Control Server</h1><p class="muted">登录后管理图表、设备、文件与网络服务</p><label class="field">用户名<input id="username" value="admin" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" value="" autocomplete="current-password" required></label><button class="primary">登录</button><div id="error" class="error"></div></form></main>
<main id="dashboard" class="shell hidden"><header class="top"><div><h1>服务控制台</h1><div class="muted">当前用户：<span id="who"></span></div></div><button id="logout">退出登录</button></header>
<section class="grid">
<a class="card" href="/drawio/"><span class="icon">◇</span><h2>服务器 Drawio</h2><div class="muted">新建、打开和保存图表到部署服务器</div></a>
<a id="ports" class="card"><span class="icon">⌁</span><h2>端口扫描服务</h2><div class="muted">端口探测、映射和下载测试</div></a>
<a id="frp" class="card"><span class="icon">⇆</span><h2>FRP 工具箱</h2><div class="muted">发现、探测、带宽与配置管理</div></a>
<a class="card" href="#" id="devices"><span class="icon">▣</span><h2>设备管理 API</h2><div class="muted">Agent 注册、心跳、任务和远程文件</div></a>
<a class="card" href="#" id="files"><span class="icon">▤</span><h2>服务器文件</h2><div class="muted">文件位于受控的服务器存储根目录</div></a>
<a class="card" href="/api/health" target="_blank"><span class="icon">✓</span><h2>服务健康检查</h2><div class="muted">检查统一后端运行状态</div></a>
</section><section class="status"><div class="row"><span class="pill">Drawio 已内置</span><span class="pill">Device Agent 兼容</span><span class="pill">Bearer 认证</span><span class="pill">SQLite 持久化</span></div><pre id="output" class="muted">选择设备或文件卡片可查看实时 API 数据。</pre></section></main>
<script>
const $=s=>document.querySelector(s),key='devControlToken',userKey='devControlUser';
function show(){const t=localStorage.getItem(key),u=JSON.parse(localStorage.getItem(userKey)||'null');$('#login').classList.toggle('hidden',!!t);$('#dashboard').classList.toggle('hidden',!t);if(t){$('#who').textContent=u?u.username+' ('+u.role+')':'';$('#ports').href='/tools/ports/?access_token='+encodeURIComponent(t);$('#frp').href='/tools/frp/?access_token='+encodeURIComponent(t)}}
async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+localStorage.getItem(key)}});if(r.status===401){localStorage.removeItem(key);show();throw Error('登录已过期')}return r.json()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登录失败');localStorage.setItem(key,d.token);localStorage.setItem(userKey,JSON.stringify(d.user));show()}catch(x){$('#error').textContent=x.message}};
$('#logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+localStorage.getItem(key)}})}catch(e){}localStorage.clear();show()};
$('#devices').onclick=async e=>{e.preventDefault();$('#output').textContent=JSON.stringify(await api('/api/devices'),null,2)};
$('#files').onclick=async e=>{e.preventDefault();$('#output').textContent=JSON.stringify(await api('/api/files'),null,2)};show();
</script></body></html>
