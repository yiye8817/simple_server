<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hermes 远程操作</title>
<style>
:root{font:14px Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--panel2:var(--ui-accent-soft);--blue:var(--ui-accent);--green:var(--ui-success);--muted:var(--ui-muted);--red:var(--ui-danger)}*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at 85% 0,var(--ui-accent-soft),transparent 35%),var(--ui-canvas)}button,input,textarea{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1500px;margin:auto}.header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--ui-surface);backdrop-filter:blur(16px)}.brand{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#67c5ff,#496aff);font-size:22px;color:#061323;font-weight:900}.heading{flex:1}.heading h1{font-size:20px;margin:0 0 3px}.muted{color:var(--muted)}.status{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ui-muted)}.dot.on{background:var(--green);box-shadow:0 0 12px var(--ui-success)}.dot.off{background:var(--red)}.body{display:grid;grid-template-columns:270px minmax(0,1fr) 280px;min-height:0}.panel{min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--ui-surface)}.panel.right{border-left:1px solid var(--line);border-right:0;padding:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;gap:8px}.panel-head h2{font-size:14px;margin:0}.new,.icon-btn,.send{border:0;border-radius:9px;background:var(--blue);color:#061323;font-weight:800}.new{padding:7px 10px}.icon-btn{width:34px;height:34px;background:var(--ui-accent-soft);color:var(--ui-text)}.search{width:calc(100% - 28px);margin:0 14px 10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.conversations{padding:0 9px}.conversation{display:block;width:100%;padding:11px 10px;margin:3px 0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ui-text);text-align:left}.conversation:hover,.conversation.active{background:var(--ui-accent-soft);border-color:var(--ui-line)}.conversation strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation small{display:block;margin-top:4px;color:var(--muted)}.chat{min-width:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--ui-field)}.chat-head{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line)}.chat-head h2{margin:0;font-size:17px;flex:1}.messages{overflow:auto;padding:24px clamp(16px,5vw,72px);display:flex;flex-direction:column;gap:16px}.empty{margin:auto;text-align:center;max-width:480px}.empty .spark{font-size:42px;margin-bottom:8px}.bubble{max-width:min(760px,88%);padding:12px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);white-space:pre-wrap;word-break:break-word;line-height:1.6}.msg.user{align-self:flex-end}.msg.user .bubble{border-color:var(--ui-line);background:var(--ui-accent-soft)}.msg.assistant{align-self:flex-start}.msg-meta{font-size:11px;color:var(--muted);margin:0 5px 5px}.msg.user .msg-meta{text-align:right}.composer-wrap{padding:12px clamp(16px,5vw,72px) 18px;border-top:1px solid var(--line);background:var(--ui-surface)}.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.attachment{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-accent-soft);color:var(--ui-accent);font-size:12px}.attachment button{border:0;background:transparent;color:var(--ui-muted);padding:0}.composer{display:flex;gap:9px;align-items:flex-end;padding:9px;border:1px solid var(--ui-line);border-radius:13px;background:var(--ui-field)}.composer textarea{flex:1;resize:none;min-height:45px;max-height:150px;border:0;outline:0;background:transparent;color:var(--ui-text);line-height:1.5}.send{min-width:72px;height:40px}.send:disabled{opacity:.5;cursor:wait}.composer-tools{display:flex;align-items:center;gap:7px;margin-top:8px}.file-label{padding:6px 9px;border:1px solid var(--line);border-radius:7px;color:var(--ui-muted);cursor:pointer}.file-label input{display:none}.skill-chip{padding:5px 9px;border:1px solid var(--ui-line);border-radius:999px;background:var(--ui-accent-soft);color:var(--ui-accent);cursor:pointer}.skill-chip.on{background:var(--ui-accent-soft);color:var(--ui-text);border-color:var(--ui-accent)}.section{margin-bottom:20px}.section h3{font-size:13px;margin:0 0 10px}.skill-list,.function-list{display:grid;gap:8px}.skill,.function{width:100%;display:block;text-align:left;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--ui-surface);color:var(--ui-text)}.skill:hover,.function:hover{border-color:var(--blue);background:var(--ui-accent-soft)}.skill strong,.function strong{display:block}.skill small,.function small{display:block;margin-top:4px;color:var(--muted);line-height:1.4}.skill .skill-icon{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:6px;border-radius:7px;background:var(--ui-accent-soft);color:var(--ui-accent)}.skill strong{display:flex;align-items:center}.notice{color:var(--muted);font-size:12px;line-height:1.5}.error{color:var(--red)}@media(max-width:1050px){.body{grid-template-columns:230px minmax(0,1fr)}.panel.right{display:none}}@media(max-width:700px){.header{padding:12px 14px}.status{display:none}.body{grid-template-columns:1fr}.panel.left{display:none}.messages{padding:16px 12px}.composer-wrap{padding:10px 12px 14px}.bubble{max-width:94%}.chat-head{padding:13px 14px}}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head>
<body class="ui-page ui-hermes"><main class="shell">
<header class="header"><div class="brand">H</div><div class="heading"><h1>Hermes 远程操作</h1><div class="muted">聊天驱动的服务器、设备与文件助手</div></div><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">检查 Hermes 后端…</span></div></header>
<section class="body">
<aside class="panel left"><div class="panel-head"><h2>对话</h2><button class="new" id="newConversation">＋ 新对话</button></div><input class="search" id="conversationSearch" placeholder="搜索对话内容"><div class="conversations" id="conversationList"></div></aside>
<section class="chat"><header class="chat-head"><h2 id="conversationTitle">新对话</h2><span class="muted" id="messageCount">0 条消息</span></header><div class="messages" id="messages"><div class="empty"><div class="spark">✦</div><h2>让 Hermes 帮你完成操作</h2><p class="muted">可以直接描述目标，也可以从右侧选择常用 Skill 或上传文件后让 Hermes 分析。</p></div></div><div class="composer-wrap"><div class="attachments" id="attachments"></div><div class="composer"><textarea id="messageInput" rows="1" placeholder="例如：检查当前在线设备，并告诉我哪台设备最近一次心跳异常"></textarea><button class="send" id="send" disabled>发送</button></div><div class="composer-tools"><label class="file-label">＋ 选择文件<input id="filePicker" type="file" multiple></label><div id="selectedSkill"></div><span class="notice" id="composerNotice">Enter 发送 · Shift+Enter 换行</span></div></div></section>
<aside class="panel right"><div class="section"><h3>常用 Skill</h3><div class="skill-list" id="skills"></div></div><div class="section"><h3>常用功能</h3><div class="function-list" id="functions"></div></div><p class="notice">点击功能会把建议填入输入框；Hermes 的实际能力取决于已连接的远程后端。</p></aside>
</section></main>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('devControlToken')||'',headers=()=>({Authorization:'Bearer '+token()}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let conversations=[],conversationId=null,files=[],skill=null,busy=false;
async function api(url,opt={}){opt.headers=Object.assign(headers(),opt.headers||{});let r=await fetch(url,opt),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d.error||d||'请求失败');return d}
function formatTime(t){return t?new Date(t*1000).toLocaleString([], {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}
async function loadStatus(){try{let d=await api('/api/hermes/status');$('#statusDot').className='dot '+(d.connected?'on':'off');$('#statusText').textContent=d.backend==='local'?'本机 Hermes 已连接':(d.backend==='remote'?'远程 Hermes 已连接':'未找到本机 Hermes')}catch(e){$('#statusDot').className='dot off';$('#statusText').textContent='Hermes 状态不可用'}}
async function loadCatalog(){try{let d=await api('/api/hermes/catalog');$('#skills').innerHTML=d.skills.map(x=>`<button class="skill" data-skill="${esc(x.id)}"><strong><span class="skill-icon">${esc(x.icon||'✦')}</span>${esc(x.name)}</strong><small>${esc(x.description||'')}</small></button>`).join('');$('#functions').innerHTML=d.functions.map(x=>`<button class="function" data-function="${esc(x.id)}" data-hint="${esc(x.hint||x.description||x.name||'')}"><strong>${esc(x.name||x.id)}</strong><small>${esc(x.hint||x.description||'')}</small></button>`).join('');document.querySelectorAll('.skill').forEach(x=>x.onclick=()=>{skill=x.dataset.skill;$('#selectedSkill').innerHTML=`<span class="skill-chip on">Skill：${esc(x.textContent.trim())} ×</span>`});document.querySelectorAll('.function').forEach(x=>x.onclick=()=>{$('#messageInput').value=x.dataset.hint;$('#messageInput').focus();resizeInput()})}catch(e){$('#skills').innerHTML='<div class="notice error">Skill 列表加载失败</div>'}}
async function loadConversations(query=''){let d=await api('/api/hermes/conversations'+(query?'?q='+encodeURIComponent(query):''));conversations=d.conversations;renderConversations();if(conversationId){let found=conversations.find(x=>x.id===conversationId);if(found&&query)await selectConversation(found.id)}else if(!conversations.length&&!query)await newConversation()}
function renderConversations(){let q=$('#conversationSearch').value.trim().toLowerCase();let list=conversations.filter(x=>!q||x.title.toLowerCase().includes(q));$('#conversationList').innerHTML=list.map(x=>`<button class="conversation ${x.id===conversationId?'active':''}" data-id="${x.id}"><strong>${esc(x.title)}</strong><small>${formatTime(x.updated_at)}</small></button>`).join('')||'<p class="notice" style="padding:10px">暂无匹配对话</p>';document.querySelectorAll('.conversation').forEach(x=>x.onclick=()=>selectConversation(Number(x.dataset.id)))}
async function newConversation(){let d=await api('/api/hermes/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});conversationId=d.conversation.id;conversations=[d.conversation,...conversations.filter(x=>x.id!==conversationId)];renderConversations();renderMessages(d.conversation,[]);$('#messageInput').focus()}
async function selectConversation(id){let d=await api('/api/hermes/conversations/'+id);conversationId=id;renderConversations();renderMessages(d.conversation,d.messages)}
function renderMessages(conv,msgs){$('#conversationTitle').textContent=conv.title;$('#messageCount').textContent=msgs.length+' 条消息';$('#messages').innerHTML=msgs.length?msgs.map(m=>`<article class="msg ${m.role==='user'?'user':'assistant'}"><div class="msg-meta">${m.role==='user'?'你':'Hermes'} · ${formatTime(m.created_at)}</div><div class="bubble">${esc(m.content)}${m.attachments?.length?'<div class="notice" style="margin-top:8px">附件：'+m.attachments.map(x=>esc(x.name||x.filename||'文件')).join('、')+'</div>':''}</div></article>`).join(''):'<div class="empty"><div class="spark">✦</div><h2>新对话</h2><p class="muted">输入任务，Hermes 会结合已连接的服务执行。</p></div>';$('#messages').scrollTop=$('#messages').scrollHeight}
function renderFiles(){ $('#attachments').innerHTML=files.map((f,i)=>`<span class="attachment">📎 ${esc(f.name)} <button data-file="${i}" aria-label="移除附件">×</button></span>`).join('');document.querySelectorAll('[data-file]').forEach(x=>x.onclick=()=>{files.splice(Number(x.dataset.file),1);renderFiles()}) }
function resizeInput(){let x=$('#messageInput');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,150)+'px';$('#send').disabled=!x.value.trim()||busy}
async function send(){let text=$('#messageInput').value.trim();if(!text||busy)return;busy=true;resizeInput();$('#send').textContent='发送中';try{let uploaded=[];if(files.length){let form=new FormData();form.append('conversation_id',conversationId);files.forEach(x=>form.append('files',x));let up=await api('/api/hermes/upload',{method:'POST',headers:headers(),body:form});uploaded=up.files}let d=await api('/api/hermes/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:conversationId,message:text,attachments:uploaded,skill})});$('#messageInput').value='';files=[];renderFiles();let detail=await api('/api/hermes/conversations/'+d.conversation_id);conversationId=d.conversation_id;renderMessages(detail.conversation,detail.messages);conversations=[detail.conversation,...conversations.filter(x=>x.id!==detail.conversation.id)];renderConversations();$('#composerNotice').textContent=d.degraded?'已保存对话，等待 Hermes 后端恢复。':'Hermes 已回复'}catch(e){$('#composerNotice').textContent=e.message;$('#composerNotice').className='notice error'}finally{busy=false;$('#send').textContent='发送';resizeInput()}}
$('#newConversation').onclick=()=>newConversation().catch(e=>$('#composerNotice').textContent=e.message);let searchTimer;$('#conversationSearch').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadConversations($('#conversationSearch').value.trim()).catch(e=>$('#composerNotice').textContent=e.message),220)};$('#messageInput').oninput=resizeInput;$('#messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#send').onclick=send;$('#filePicker').onchange=e=>{files=[...files,...e.target.files].slice(0,20);e.target.value='';renderFiles()};
Promise.all([loadStatus(),loadCatalog(),loadConversations()]).catch(e=>{$('#composerNotice').textContent=e.message});
</script></body></html>
