<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小记</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--blue:var(--ui-accent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ui-canvas)}body{padding:20px}button,input,textarea{font:inherit}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0}.muted{color:var(--ui-muted)}.bad{color:var(--ui-danger)}.ok{color:var(--ui-success)}.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer;min-height:40px}.ghost{border:1px solid var(--line);background:transparent;color:var(--ui-text)}.danger{background:var(--ui-danger);color:var(--ui-text)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:14px;margin-top:18px;min-height:calc(100vh - 140px)}.list,.editor{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:auto}.list{padding:8px}.note{display:block;width:100%;text-align:left;padding:12px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:var(--ui-text);cursor:pointer}.note.on,.note:hover{background:var(--ui-accent-soft)}.note small{display:block;color:var(--ui-muted);margin-top:4px}.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--ui-accent-soft);color:var(--ui-accent);font-size:11px}.editor{padding:16px;display:flex;flex-direction:column;gap:10px}.editor input.title,.editor textarea{width:100%;padding:10px 12px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.editor textarea{flex:1;min-height:280px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.back{display:none}.notice{min-height:18px}.hidden{display:none!important}.sheet-tools{display:flex;gap:8px;flex-wrap:wrap}.sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;flex:1;min-height:280px;background:var(--ui-field)}.sheet{border-collapse:collapse;min-width:100%}.sheet th,.sheet td{border:1px solid var(--ui-line);padding:0;min-width:110px}.sheet input{width:100%;border:0;background:transparent;color:var(--ui-text);padding:8px;min-height:38px}.sheet th input{font-weight:700;color:var(--ui-accent)}@media(max-width:800px){body{padding:12px}h1{font-size:22px}.layout{grid-template-columns:1fr;min-height:auto}.editor{display:none}.layout.show-editor .list{display:none}.layout.show-editor .editor{display:flex}.back{display:inline-flex}.btn{flex:1}input,select,textarea,button{font-size:16px}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-notes"><div class="wrap"><header class="top"><div><h1>小记</h1><div class="muted">支持普通备忘和表格，仅当前登录用户可见</div></div><div class="top-actions"><button class="btn" id="create">＋ 新建小记</button><button class="btn ghost" id="createTable">＋ 新建表格</button></div></header>
<div class="layout" id="layout"><aside class="list" id="list"></aside>
<section class="editor"><button class="btn ghost back" id="back">返回列表</button><input id="title" class="title" placeholder="标题">
<textarea id="content" placeholder="写下内容…"></textarea>
<div id="tableEditor" class="hidden"><div class="sheet-tools"><button class="btn ghost" id="addCol" type="button">加列</button><button class="btn ghost" id="addRow" type="button">加行</button><button class="btn ghost" id="delCol" type="button">删列</button><button class="btn ghost" id="delRow" type="button">删行</button></div><div class="sheet-wrap"><table class="sheet" id="sheet"></table></div></div>
<div class="actions"><button class="btn" id="save">保存</button><button class="btn danger" id="remove" disabled>删除</button></div><div id="notice" class="notice muted">选择左侧小记，或新建一条。</div></section></div></div>
<script>
const $=s=>document.querySelector(s),H=()=>({Authorization:'Bearer '+(localStorage.getItem('devControlToken')||''),'Content-Type':'application/json'});
const emptyTable=()=>({headers:['列1','列2','列3'],rows:[['','',''],['','','']]});
let notes=[],current=null,dirty=false,kind='text',grid=emptyTable();
async function api(url,opt={}){opt.headers=Object.assign(H(),opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(msg,ok){$('#notice').textContent=msg;$('#notice').className='notice '+(ok===true?'ok':ok===false?'bad':'muted')}
function parseTable(raw){try{let d=JSON.parse(raw||'');if(d&&Array.isArray(d.headers)&&Array.isArray(d.rows)){let n=Math.max(1,d.headers.length),rows=d.rows.length?d.rows:[Array(n).fill('')];return {headers:d.headers.map(x=>String(x??'')),rows:rows.map(r=>{let row=[...r].map(c=>String(c??''));while(row.length<n)row.push('');return row.slice(0,n)})}}}catch(e){}return emptyTable()}
function renderSheet(){let n=grid.headers.length;$('#sheet').innerHTML='<thead><tr>'+grid.headers.map((h,i)=>`<th><input data-h="${i}" value="${esc(h)}"></th>`).join('')+'</tr></thead><tbody>'+grid.rows.map((row,ri)=>'<tr>'+row.map((c,ci)=>`<td><input data-r="${ri}" data-c="${ci}" value="${esc(c)}"></td>`).join('')+'</tr>').join('')+'</tbody>';
document.querySelectorAll('#sheet input').forEach(inp=>inp.oninput=()=>{dirty=true;if(inp.dataset.h!=null)grid.headers[+inp.dataset.h]=inp.value;else{grid.rows[+inp.dataset.r][+inp.dataset.c]=inp.value}})}
function setKind(k){kind=k||'text';$('#content').classList.toggle('hidden',kind==='table');$('#tableEditor').classList.toggle('hidden',kind!=='table')}
function render(){$('#list').innerHTML=notes.map(n=>`<button class="note ${current&&current.id===n.id?'on':''}" data-id="${n.id}"><strong>${esc(n.title)}</strong>${n.kind==='table'?'<span class="tag">表格</span>':''}<small>${new Date(n.updated_at*1000).toLocaleString()}</small></button>`).join('')||'<p class="muted" style="padding:12px">还没有小记</p>';
document.querySelectorAll('.note').forEach(b=>b.onclick=()=>openNote(Number(b.dataset.id)))}
function fill(n){current=n;$('#title').value=n?n.title:'';kind=n&&n.kind==='table'?'table':'text';setKind(kind);if(kind==='table'){grid=parseTable(n&&n.content);renderSheet();$('#content').value=''}else{$('#content').value=n?n.content:'';grid=emptyTable()}$('#remove').disabled=!n||!n.id;dirty=false;$('#layout').classList.toggle('show-editor',!!n);render()}
async function load(){notes=(await api('/api/notes')).notes;if(current&&current.id){current=notes.find(x=>x.id===current.id)||current}render()}
async function openNote(id){if(dirty&&!confirm('当前内容未保存，确定切换？'))return;fill(notes.find(x=>x.id===id))}
function startNew(isTable){if(dirty&&!confirm('当前内容未保存，确定新建？'))return;fill({id:null,title:'',content:isTable?JSON.stringify(emptyTable()):'',kind:isTable?'table':'text'});$('#title').focus();notice(isTable?'填写表格后点击保存':'填写后点击保存')}
$('#create').onclick=()=>startNew(false);$('#createTable').onclick=()=>startNew(true);
$('#back').onclick=()=>{$('#layout').classList.remove('show-editor')}
$('#title').oninput=$('#content').oninput=()=>{dirty=true}
$('#addCol').onclick=()=>{grid.headers.push('列'+(grid.headers.length+1));grid.rows.forEach(r=>r.push(''));dirty=true;renderSheet()}
$('#addRow').onclick=()=>{grid.rows.push(grid.headers.map(()=>''));dirty=true;renderSheet()}
$('#delCol').onclick=()=>{if(grid.headers.length<=1)return;grid.headers.pop();grid.rows.forEach(r=>r.pop());dirty=true;renderSheet()}
$('#delRow').onclick=()=>{if(grid.rows.length<=1)return;grid.rows.pop();dirty=true;renderSheet()}
$('#save').onclick=async()=>{try{let payload={title:$('#title').value,kind,content:kind==='table'?JSON.stringify(grid):$('#content').value};if(current&&current.id){current=await api('/api/notes/'+current.id,{method:'PATCH',body:JSON.stringify(payload)});notice('已保存',true)}else{current=await api('/api/notes',{method:'POST',body:JSON.stringify(payload)});notice('已新建',true)}dirty=false;await load();fill(current)}catch(e){notice(e.message,false)}}
$('#remove').onclick=async()=>{if(!current||!current.id)return;if(!confirm('确定删除这条小记？'))return;try{await api('/api/notes/'+current.id,{method:'DELETE'});current=null;dirty=false;await load();fill(null);$('#layout').classList.remove('show-editor');notice('已删除',true)}catch(e){notice(e.message,false)}}
load().catch(e=>notice(e.message,false));
</script></body></html>
