<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大模型接口管理</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--blue:var(--ui-accent)}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 85% 0,var(--ui-accent-soft),transparent 34%),var(--ui-canvas)}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.top h1{margin:0}.btn{padding:9px 13px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer}.danger{background:var(--ui-danger);color:var(--ui-text)}.ghost{background:transparent;color:var(--ui-text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px;margin-top:22px}.card{padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.card h3{margin:0 0 5px}.muted{color:var(--ui-muted)}.uri{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0;color:var(--ui-accent)}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:3px 7px;border-radius:12px;background:var(--ui-accent-soft);color:var(--ui-accent);font-size:11px}.state{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.ok{color:var(--ui-success)}.bad{color:var(--ui-danger)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .btn{padding:7px 9px;font-size:12px}.models{max-height:110px;overflow:auto;margin-top:12px;padding:9px;border-radius:8px;background:var(--ui-field);color:var(--ui-muted);font-size:12px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#02070dcc;padding:18px}.modal.hide{display:none}.dialog{width:min(650px,100%);max-height:94vh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:15px;background:var(--ui-surface)}.dialog h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.field textarea{min-height:85px}.foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.empty{grid-column:1/-1;padding:50px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--ui-muted)}.notice{margin-top:12px;min-height:20px}@media(max-width:650px){body{padding:14px}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}h1{font-size:22px}.btn{min-height:40px}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-llm"><div class="wrap"><header class="top"><div><h1>大模型接口管理</h1><div class="muted">统一管理 URI、密钥、模型与对外配置</div></div><button class="btn" onclick="openForm()">＋ 添加接口</button></header><div id="notice" class="notice"></div><section id="grid" class="grid"></section></div>
<div id="modal" class="modal hide"><form id="form" class="dialog"><h2 id="formTitle">添加大模型接口</h2><input id="pid" type="hidden"><div class="form"><label class="field">名称<input id="name" required placeholder="OpenAI / Claude / 本地 Ollama"></label><label class="field">协议<select id="style"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option><option value="google">Google Gemini</option><option value="custom">自定义 Bearer</option></select></label><label class="field wide">Base URI<input id="base" required placeholder="https://api.example.com/v1"></label><label class="field wide">API Key<input id="key" type="password" placeholder="编辑时留空表示不修改"></label><label class="field">官网<input id="official" placeholder="https://example.com"></label><label class="field">关键字<input id="keywords" placeholder="chat,reasoning,embedding"></label><label class="field wide">模型列表路径<input id="modelsPath" placeholder="默认按协议选择，如 /models"></label><label class="field wide">附加请求头（JSON，值可使用 ${API_KEY}）<textarea id="extraHeaders" placeholder='{"X-Custom-Key":"${API_KEY}"}'></textarea></label></div><div class="foot"><button type="button" class="btn ghost" onclick="closeForm()">取消</button><button class="btn">保存</button></div></form></div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('devControlToken')||'',H=()=>({Authorization:'Bearer '+token(),'Content-Type':'application/json'});let rows=[];
async function api(url,opt={}){opt.headers=Object.assign(H(),opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{rows=(await api('/api/llm/providers')).providers;render()}catch(e){notice(e.message,false)}}
function render(){$('#grid').innerHTML=rows.map(p=>`<article class="card"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.api_style)} · ${esc(p.api_key_masked||'无密钥')}</div><div class="uri" title="${esc(p.base_uri)}">${esc(p.base_uri)}</div><div class="tags">${p.keywords.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="state"><span class="${p.last_check_ok?'ok':'bad'}">${p.last_check_at?(p.last_check_ok?'● 检测正常':'● 检测失败'):'○ 尚未检测'}</span><span class="muted">${p.models.length} 个模型</span></div>${p.last_error?`<div class="bad">${esc(p.last_error).slice(0,160)}</div>`:''}<div class="models">${p.models.length?p.models.map(esc).join('<br>'):'暂无模型数据'}</div><div class="actions"><button class="btn" onclick="checkProvider(${p.id})">检测并获取模型</button><button class="btn ghost" onclick="editProvider(${p.id})">编辑</button><button class="btn ghost" onclick="copyConfig(${p.id})">复制配置</button>${p.official_url?`<button class="btn ghost" onclick="window.open('${esc(p.official_url)}','_blank')">官网</button>`:''}<button class="btn danger" onclick="removeProvider(${p.id})">删除</button></div></article>`).join('')||'<div class="empty">尚未配置大模型接口</div>'}
function openForm(p=null){$('#form').reset();$('#pid').value=p?p.id:'';$('#formTitle').textContent=p?'编辑接口':'添加大模型接口';if(p){$('#name').value=p.name;$('#style').value=p.api_style;$('#base').value=p.base_uri;$('#official').value=p.official_url||'';$('#keywords').value=p.keywords.join(',');$('#modelsPath').value=p.models_path||''}$('#extraHeaders').value='' ;$('#modal').classList.remove('hide')}
function closeForm(){$('#modal').classList.add('hide')}function editProvider(id){openForm(rows.find(x=>x.id===id))}
$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#pid').value,d={name:$('#name').value.trim(),api_style:$('#style').value,base_uri:$('#base').value.trim(),api_key:$('#key').value.trim(),official_url:$('#official').value.trim(),keywords:$('#keywords').value.split(',').map(x=>x.trim()).filter(Boolean),models_path:$('#modelsPath').value.trim()};try{let eh=$('#extraHeaders').value.trim();if(eh)d.headers=JSON.parse(eh);await api(id?'/api/llm/providers/'+id:'/api/llm/providers',{method:id?'PATCH':'POST',body:JSON.stringify(d)});closeForm();notice('配置已保存',true);load()}catch(x){notice(x.message,false)}};
async function checkProvider(id){notice('正在从服务器检测接口…',true);try{let d=await api(`/api/llm/providers/${id}/check`,{method:'POST'});notice(d.ok?`检测成功：${d.model_count} 个模型，${d.latency_ms}ms`:`检测失败：${d.error}`,d.ok);load()}catch(e){notice(e.message,false)}}
async function removeProvider(id){if(!confirm('确定删除该接口配置？'))return;await api('/api/llm/providers/'+id,{method:'DELETE'});load()}
async function copyConfig(id){try{let d=await api(`/api/llm/providers/${id}/config`);await navigator.clipboard.writeText(JSON.stringify(d,null,2));notice('完整配置已复制到剪贴板（包含 API Key，请妥善保管）',true)}catch(e){notice(e.message,false)}}
function notice(msg,ok){$('#notice').textContent=msg;$('#notice').className='notice '+(ok?'ok':'bad')}load();
</script></body></html>
