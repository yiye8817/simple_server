<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:#dce8f5;background:#091321;--line:#294159;--panel:#101e30;--blue:#54abff}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 85% 0,#193d64,transparent 34%),#091321}button,input,select{font:inherit}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer}.ghost{border:1px solid var(--line);background:transparent;color:#dce8f5}.danger{background:#e66370;color:#fff}.muted{color:#8ea5ba}.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;margin-top:20px}.table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--panel)}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:#8ea5ba}.mini{padding:6px 8px;border:0;border-radius:6px;background:#31506d;color:white;cursor:pointer}.drawer{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:auto}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:10px;border-radius:8px;background:#091522}.stat strong{display:block;font-size:20px}.token{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#091522}.secret{word-break:break-all;color:#87c7ff;font-family:monospace}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#02070dcc}.hide{display:none}.dialog{width:min(440px,92vw);padding:23px;border:1px solid var(--line);border-radius:14px;background:#101d2d}.field{display:grid;gap:5px;margin:12px 0}.field input,.field select{padding:10px;border:1px solid #36516c;border-radius:8px;background:#091522;color:#fff}.foot{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}@media(max-width:850px){body{padding:12px}.layout{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><h1>用户管理</h1><div class="muted">用户、访问 Token 与独立使用统计</div></div><button id="add" class="btn">＋ 新建用户</button></header><div class="layout"><div><table class="table"><thead><tr><th>用户</th><th>角色/状态</th><th>Token</th><th>设备</th><th>任务</th><th>打字正确率</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><aside class="drawer"><h2 id="selected">选择一个用户</h2><div id="stats" class="stats"></div><h3>访问 Token</h3><button id="newToken" class="btn" disabled>生成 Token</button><div id="tokens"></div></aside></div></div>
<div id="modal" class="modal hide"><form id="form" class="dialog"><h2>新建用户</h2><label class="field">用户名<input id="username" required minlength="3"></label><label class="field">密码<input id="password" type="password" required minlength="8"></label><label class="field">角色<select id="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><div class="foot"><button type="button" class="btn ghost" onclick="closeForm()">取消</button><button class="btn">创建</button></div></form></div><script>
const $=s=>document.querySelector(s),auth=()=>({Authorization:'Bearer '+(localStorage.getItem('devControlToken')||''),'Content-Type':'application/json'});let users=[],current=null;async function api(url,opt={}){opt.headers=Object.assign(auth(),opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){users=(await api('/api/user-management/users')).users;$('#rows').innerHTML=users.map(u=>`<tr><td><strong>${esc(u.username)}</strong><br><small class="muted">ID ${u.id}</small></td><td>${u.role}<br>${u.active?'<span style="color:#6fdda0">启用</span>':'<span style="color:#ff8190">停用</span>'}</td><td>${u.active_tokens}</td><td>${u.devices}</td><td>${u.tasks}</td><td>${u.typing_accuracy}% (${u.typing_total})</td><td><button class="mini" onclick="selectUser(${u.id})">详情</button> <button class="mini" onclick="resetPassword(${u.id})">改密码</button> <button class="mini" onclick="toggleUser(${u.id},${u.active?0:1})">${u.active?'停用':'启用'}</button></td></tr>`).join('');if(current){let still=users.find(x=>x.id===current.id);if(still)selectUser(still.id)}}
async function selectUser(id){current=users.find(x=>x.id===id);$('#selected').textContent=current.username;$('#newToken').disabled=false;$('#stats').innerHTML=[['活跃会话',current.active_sessions],['访问 Token',current.active_tokens],['设备',current.devices],['创建任务',current.tasks],['打字总数',current.typing_total],['正确率',current.typing_accuracy+'%']].map(x=>`<div class="stat"><strong>${x[1]}</strong><span class="muted">${x[0]}</span></div>`).join('');await loadTokens()}
async function loadTokens(){let d=await api(`/api/user-management/users/${current.id}/tokens`);$('#tokens').innerHTML=d.tokens.map(t=>`<div class="token"><div>${esc(t.label)} · ${t.active?'有效':'已撤销'}</div><div class="secret">${esc(t.token)}</div><div class="muted">创建：${new Date(t.created_at*1000).toLocaleString()}${t.last_used_at?' · 最后使用 '+new Date(t.last_used_at*1000).toLocaleString():''}</div><div class="actions"><button class="mini" onclick="copyToken('${esc(t.token)}')">复制</button>${t.active?`<button class="mini danger" onclick="revoke(${t.id})">撤销</button>`:''}</div></div>`).join('')||'<p class="muted">暂无长期访问 Token</p>'}
$('#newToken').onclick=async()=>{let label=prompt('Token 名称','API Token');if(!label)return;let d=await api(`/api/user-management/users/${current.id}/tokens`,{method:'POST',body:JSON.stringify({label})});await navigator.clipboard.writeText(d.token);alert('Token 已生成并复制：\n'+d.token);load();loadTokens()};async function revoke(id){if(!confirm('撤销后使用该 Token 的程序将无法访问，继续？'))return;await api(`/api/user-management/users/${current.id}/tokens/${id}`,{method:'DELETE'});load();loadTokens()}async function copyToken(t){await navigator.clipboard.writeText(t);alert('Token 已复制')}
$('#add').onclick=()=>$('#modal').classList.remove('hide');function closeForm(){$('#modal').classList.add('hide')}$('#form').onsubmit=async e=>{e.preventDefault();await api('/api/auth/users',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value,role:$('#role').value})});closeForm();e.target.reset();load()};async function resetPassword(id){let p=prompt('输入新密码（至少8位）');if(!p)return;await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('密码已更新')}async function toggleUser(id,active){if(!confirm(active?'启用该用户？':'停用该用户？'))return;await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({active:!!active})});load()}load().catch(e=>{$('#rows').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`});
</script></body></html>
