<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>接口调试</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--blue:var(--ui-accent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ui-canvas)}body{padding:20px}button,input,select,textarea{font:inherit}.wrap{max-width:1280px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0}.muted{color:var(--ui-muted)}.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer;min-height:40px}.ghost{border:1px solid var(--line);background:transparent;color:var(--ui-text)}.layout{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:14px;margin-top:16px}.pane{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;min-height:420px;overflow:auto}.search{width:100%;margin:8px 0 12px;padding:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.group{margin:12px 0 6px;color:var(--ui-muted);font-size:12px}.ep{display:flex;gap:8px;align-items:center;width:100%;margin:4px 0;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--ui-text);text-align:left;cursor:pointer}.ep.on,.ep:hover{background:var(--ui-accent-soft)}.m{flex:none;width:58px;font-size:11px;font-weight:800;color:#07121d;text-align:center;border-radius:5px;padding:2px 0}.GET{background:var(--ui-success)}.POST{background:var(--ui-accent)}.PUT,.PATCH{background:#f0c36d}.DELETE{background:var(--ui-danger)}.path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.field textarea{min-height:140px;font:12px/1.45 ui-monospace,monospace}.row{display:grid;grid-template-columns:110px 1fr;gap:8px}.params{display:grid;gap:8px}.resp{white-space:pre-wrap;word-break:break-word;background:#07101b;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:160px;color:#b8d5ef;font:12px/1.45 ui-monospace,monospace}.ok{color:var(--ui-success)}.bad{color:var(--ui-danger)}.back{display:none}@media(max-width:860px){body{padding:12px}h1{font-size:22px}.layout{grid-template-columns:1fr}.tester{display:none}.layout.show-tester .catalog{display:none}.layout.show-tester .tester{display:block}.back{display:inline-flex}.row{grid-template-columns:1fr}.btn{flex:1}input,select,textarea,button{font-size:16px}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-apis"><div class="wrap"><header class="top"><div><h1>接口调试</h1><div class="muted">下载 OpenAPI 文件，或直接在本页测试当前站点接口</div></div><div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="copySpec">复制 OpenAPI</button><button class="btn" id="downloadSpec">下载 openapi.json</button></div></header>
<div class="layout" id="layout"><aside class="pane catalog"><input class="search" id="q" placeholder="搜索路径或说明"><div id="catalog"></div></aside>
<section class="pane tester"><button class="btn ghost back" id="back">返回接口列表</button><div class="row"><label class="field">方法<select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></label><label class="field">路径<input id="path" placeholder="/api/health"></label></div><div class="params" id="params"></div><label class="field">Content-Type<select id="ctype"><option value="application/json">application/json</option><option value="text/plain">text/plain</option><option value="">不设置</option></select></label><label class="field">请求体<textarea id="body" placeholder="{}"></textarea></label><label class="field">附加请求头（JSON）<textarea id="headers" placeholder='{"X-Device-Token":""}'></textarea></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="send">发送请求</button><label class="muted" style="display:flex;align-items:center;gap:6px"><input id="useToken" type="checkbox" checked> 自动带上登录 Token</label></div><p class="muted" id="meta">从左侧选择一个接口开始</p><pre class="resp" id="resp">等待请求</pre></section></div></div>
<script>
const $=s=>document.querySelector(s);let spec=null,ops=[],current=null;
function token(){return localStorage.getItem('devControlToken')||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadSpec(){let r=await fetch('/api/openapi.json',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('请先登录控制台');spec=await r.json();ops=[];
for(let [path,methods] of Object.entries(spec.paths||{}))for(let [method,op] of Object.entries(methods))ops.push({path,method:method.toUpperCase(),op});
render()}
function render(){let q=($('#q').value||'').toLowerCase(),groups={};
ops.filter(x=>(x.path+' '+x.method+' '+(x.op.summary||'')).toLowerCase().includes(q)).forEach(x=>{let tag=(x.op.tags&&x.op.tags[0])||'其他';(groups[tag]=groups[tag]||[]).push(x)});
$('#catalog').innerHTML=Object.keys(groups).map(tag=>`<div class="group">${esc(tag)}</div>`+groups[tag].map((x,i)=>`<button class="ep ${current&&current.path===x.path&&current.method===x.method?'on':''}" data-path="${esc(x.path)}" data-method="${x.method}"><span class="m ${x.method}">${x.method}</span><span class="path">${esc(x.path)}</span></button>`).join('')).join('')||'<p class="muted">没有匹配的接口</p>';
document.querySelectorAll('.ep').forEach(b=>b.onclick=()=>select(b.dataset.path,b.dataset.method))}
function select(path,method){current=ops.find(x=>x.path===path&&x.method===method);if(!current)return;$('#method').value=current.method;$('#path').value=current.path;
let params=(current.op.parameters||[]).filter(p=>p.in==='path'||p.in==='query');
$('#params').innerHTML=params.map(p=>`<label class="field">${esc(p.name)}（${p.in}${p.required?' · 必填':''}）<input data-in="${p.in}" data-name="${esc(p.name)}" placeholder="${esc(p.description||'')}"></label>`).join('');
let ex=current.op.requestBody&&current.op.requestBody.content&&current.op.requestBody.content['application/json']&&current.op.requestBody.content['application/json'].example;
$('#body').value=ex?JSON.stringify(ex,null,2):'';$('#meta').textContent=(current.op.summary||'')+(current.op.description?' · '+current.op.description:'');$('#layout').classList.add('show-tester');render()}
function buildUrl(){let path=$('#path').value.trim(),query=[];document.querySelectorAll('#params input').forEach(i=>{let v=i.value.trim();if(i.dataset.in==='path'&&v)path=path.replaceAll('{'+i.dataset.name+'}',encodeURIComponent(v));else if(i.dataset.in==='query'&&v)query.push(encodeURIComponent(i.dataset.name)+'='+encodeURIComponent(v))});return path+(query.length?'?'+query.join('&'):'')}
$('#q').oninput=render;$('#back').onclick=()=>{$('#layout').classList.remove('show-tester')}
$('#downloadSpec').onclick=async()=>{let r=await fetch('/api/openapi.json?download=1',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)return alert('下载失败，请先登录');let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='openapi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#copySpec').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(spec,null,2));alert('OpenAPI JSON 已复制')}catch(e){alert(e.message)}}
$('#send').onclick=async()=>{let url=buildUrl();if(!url.startsWith('/')){alert('仅支持本站相对路径');return}
let headers={};if($('#useToken').checked&&token())headers.Authorization='Bearer '+token();
let ct=$('#ctype').value;if(ct)headers['Content-Type']=ct;
try{let extra=$('#headers').value.trim();if(extra)Object.assign(headers,JSON.parse(extra))}catch(e){alert('附加请求头不是合法 JSON');return}
let opt={method:$('#method').value,headers};if(['POST','PUT','PATCH'].includes(opt.method)&&$('#body').value)opt.body=$('#body').value;
let started=performance.now(),r,text;try{r=await fetch(url,opt);text=await r.text()}catch(e){$('#resp').textContent='网络错误：'+e.message;return}
let pretty=text;try{pretty=JSON.stringify(JSON.parse(text),null,2)}catch(e){}
$('#resp').textContent=`HTTP ${r.status} ${r.statusText} · ${Math.round(performance.now()-started)}ms\n`+[...r.headers.entries()].map(([k,v])=>k+': '+v).join('\n')+'\n\n'+pretty;
$('#resp').className='resp '+(r.ok?'ok':'bad')}
loadSpec().catch(e=>{$('#catalog').innerHTML='<p class="bad">'+esc(e.message)+'</p>'});
</script></body></html>
