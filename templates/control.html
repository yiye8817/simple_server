<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev Control</title>
<style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:#dce8f5;background:#08111e;--line:#263b53;--panel:#101c2c;--blue:#52a9ff}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#21456f,transparent 38%)}.login form{width:min(410px,92vw);padding:34px;border:1px solid var(--line);border-radius:18px;background:#101c2ddd;box-shadow:0 30px 80px #0009}.login h1{margin:0 0 8px}.muted{color:#8fa5bb}.field{display:grid;gap:6px;margin:18px 0}.field input,.toolbar input,.command input{padding:10px 12px;border:1px solid #34506c;border-radius:8px;background:#091422;color:#fff}.primary,.toolbar button,.command button,.mini{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#07111e;font-weight:700;cursor:pointer}.primary{width:100%}.error{color:#ff8491;min-height:20px;margin-top:10px}.app{height:100vh;display:grid;grid-template-columns:245px 1fr;transition:grid-template-columns .2s ease}.side{position:relative;padding:22px 14px;border-right:1px solid var(--line);background:#0c1726;overflow:auto}.app.collapsed{grid-template-columns:74px 1fr}.app.collapsed .side{padding:14px 8px}.app.collapsed .brand{font-size:0}.app.collapsed .brand:after{content:"DC";font-size:17px}.app.collapsed .nav span:last-child,.app.collapsed .user{display:none}.app.collapsed .nav{justify-content:center}.brand{padding:8px 11px 24px;font-size:18px;font-weight:800}.nav{width:100%;display:flex;gap:11px;align-items:center;padding:12px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#aebfd0;text-align:left;cursor:pointer}.nav:hover,.nav.on{background:#182b42;color:#fff}.user{position:absolute;bottom:18px;left:16px;width:210px;padding:12px;border-top:1px solid var(--line)}.workspace{min-width:0;display:grid;grid-template-rows:62px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0d1827}.top h2{font-size:17px;margin:0}.top-left{display:flex;align-items:center;gap:12px}.collapse-btn{width:36px;font-size:18px;cursor:pointer}.top button{border:1px solid var(--line);background:transparent;color:#dce8f5;border-radius:7px;padding:7px 11px}.view{display:none;min-height:0;overflow:auto;padding:24px}.view.on{display:block}.view.frame{padding:0;overflow:hidden}.frame iframe{width:100%;height:100%;border:0;background:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{padding:20px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.card strong{font-size:24px}.toolbar,.command{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.toolbar input{min-width:260px}.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table th{color:#8fa5bb}.mini{padding:6px 9px;font-size:12px;margin-right:5px}.danger{background:#e55d6b;color:white}.folder{cursor:pointer;color:#75baff}.code{white-space:pre-wrap;word-break:break-all;background:#07101b;border:1px solid var(--line);padding:14px;border-radius:9px;color:#b8d5ef}.status{color:#75d5a2}.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.drawer{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;overflow:auto}.file-input{display:none}@media(max-width:800px){.app{grid-template-columns:74px 1fr}.app.collapsed{grid-template-columns:0 1fr}.app.collapsed .side{padding:0;border:0;overflow:hidden}.side{padding:14px 8px}.brand{font-size:0}.brand:after{content:'DC';font-size:17px}.nav span:last-child,.user{display:none}.nav{justify-content:center}.view{padding:14px}.split{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="login"><form id="loginForm" autocomplete="off"><h1>Dev Control Server</h1><p class="muted">统一服务认证与控制台</p><label class="field">用户名<input id="username" value="admin" autocomplete="off"></label><label class="field">密码<input id="password" type="password" autocomplete="new-password"></label><button class="primary">登录</button><div id="loginError" class="error"></div></form></section>
<section id="app" class="app hide"><aside class="side"><div class="brand">DEV CONTROL</div><button class="nav on" data-view="home"><span>⌂</span><span>概览</span></button><button class="nav" data-view="drawio"><span>◇</span><span>Drawio</span></button><button class="nav" data-view="ports"><span>⌁</span><span>端口服务</span></button><button class="nav" data-view="frp"><span>⇆</span><span>FRP 工具</span></button><button class="nav" data-view="llm"><span>✦</span><span>大模型接口</span></button><button class="nav" data-view="typing"><span>⌨</span><span>打字游戏</span></button><button class="nav" data-view="updates"><span>↻</span><span>服务器更新</span></button><button class="nav" data-view="users"><span>♙</span><span>用户管理</span></button><button class="nav" data-view="devices"><span>▣</span><span>设备管理</span></button><button class="nav" data-view="policies"><span>◐</span><span>黑白名单</span></button><button class="nav" data-view="files"><span>▤</span><span>文件管理</span></button><div class="user"><div id="who"></div><small class="muted">已认证</small></div></aside>
<main class="workspace"><header class="top"><div class="top-left"><button id="collapseSide" class="collapse-btn" type="button" aria-label="收起侧边栏" title="收起侧边栏">☰</button><h2 id="title">服务概览</h2></div><button id="logout">退出</button></header>
<section id="v-home" class="view on"><div class="cards"><div class="card"><div class="muted">集成服务</div><strong>10</strong><p>Drawio、端口、FRP、大模型、打字游戏、自更新、用户、设备、黑白名单与文件</p></div><div class="card"><div class="muted">认证状态</div><strong class="status">在线</strong><p>Bearer token 与设备 token 隔离</p></div><div class="card"><div class="muted">服务器文件</div><strong id="fileCount">-</strong><p>受控根目录中的文件与目录</p></div><div class="card"><div class="muted">已注册设备</div><strong id="deviceCount">-</strong><p>Device Agent 心跳和远程任务</p></div></div></section>
<section id="v-drawio" class="view frame"><iframe id="drawioFrame" title="Drawio"></iframe></section><section id="v-ports" class="view frame"><iframe id="portsFrame" title="端口服务"></iframe></section><section id="v-frp" class="view frame"><iframe id="frpFrame" title="FRP 工具"></iframe></section>
<section id="v-llm" class="view frame"><iframe id="llmFrame" title="大模型接口管理"></iframe></section><section id="v-typing" class="view frame"><iframe id="typingFrame" title="打字游戏"></iframe></section><section id="v-updates" class="view frame"><iframe id="updatesFrame" title="服务器自更新"></iframe></section><section id="v-users" class="view frame"><iframe id="usersFrame" title="用户管理"></iframe></section><section id="v-devices" class="view"><div class="split"><div><div class="toolbar"><button onclick="loadDevices()">刷新设备</button><button onclick="downloadAgent()">下载 Agent</button></div><table class="table"><thead><tr><th>设备</th><th>状态</th><th>最后心跳</th><th>操作</th></tr></thead><tbody id="deviceRows"></tbody></table></div><aside class="drawer"><h3>安装 Device Agent</h3><p class="muted">在目标 Linux 服务器执行：</p><div id="installCommand" class="code">加载中…</div><h3>远程执行</h3><p id="selectedDevice" class="muted">请先选择设备</p><div class="command"><input id="execCommand" placeholder="例如：uname -a"><button id="execBtn">执行</button></div><h3>任务结果</h3><pre id="taskOutput" class="code">暂无任务</pre></aside></div></section>
<section id="v-policies" class="view frame"><iframe id="policiesFrame" title="场景黑白名单"></iframe></section><section id="v-files" class="view frame"><iframe id="filesFrame" title="服务器文件管理"></iframe></section>
</main></section>
<script>
const $=s=>document.querySelector(s),tokenKey='devControlToken',userKey='devControlUser';let currentPath='',selectedDevice=null,taskTimer=null;
const sideKey='devControlSidebarCollapsed';function setSidebar(collapsed){$('#app').classList.toggle('collapsed',collapsed);let b=$('#collapseSide');b.textContent=collapsed?'☰':'‹';b.title=b.ariaLabel=collapsed?'展开侧边栏':'收起侧边栏';localStorage.setItem(sideKey,collapsed?'1':'0')}function token(){return localStorage.getItem(tokenKey)||''}function headers(extra={}){return Object.assign({Authorization:'Bearer '+token()},extra)}
async function api(url,opt={}){opt.headers=headers(opt.headers||{});let r=await fetch(url,opt);if(r.status===401){logout();throw Error('登录已过期')}let ct=r.headers.get('content-type')||'';let d=ct.includes('json')?await r.json():await r.blob();if(!r.ok)throw Error(d.error||'请求失败');return d}
function enter(){let ok=!!token();$('#login').classList.toggle('hide',ok);$('#app').classList.toggle('hide',!ok);if(ok){let u=JSON.parse(localStorage.getItem(userKey)||'{}');$('#who').textContent=u.username||'';loadOverview()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});let d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem(tokenKey,d.token);localStorage.setItem(userKey,JSON.stringify(d.user));enter()}catch(x){$('#loginError').textContent=x.message}};
function logout(){localStorage.removeItem(tokenKey);localStorage.removeItem(userKey);location.reload()}$('#logout').onclick=logout;$('#collapseSide').onclick=()=>setSidebar(!$('#app').classList.contains('collapsed'));setSidebar(localStorage.getItem(sideKey)==='1');
const titles={home:'服务概览',drawio:'服务器 Drawio',ports:'端口服务',frp:'FRP 工具箱',llm:'大模型接口管理',typing:'单词打字练习',updates:'服务器自更新',users:'用户管理',devices:'设备管理',policies:'场景黑白名单',files:'服务器文件管理'};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.view).classList.add('on');$('#title').textContent=titles[b.dataset.view];openView(b.dataset.view)});
function openView(v){let t=encodeURIComponent(token());if(v==='drawio'&&!$('#drawioFrame').src)$('#drawioFrame').src='/drawio/';if(v==='ports'&&!$('#portsFrame').src)$('#portsFrame').src='/tools/ports/?access_token='+t;if(v==='frp'&&!$('#frpFrame').src)$('#frpFrame').src='/tools/frp/?access_token='+t;if(v==='llm'&&!$('#llmFrame').src)$('#llmFrame').src='/llm/';if(v==='typing'&&!$('#typingFrame').src)$('#typingFrame').src='/typing/';if(v==='updates'&&!$('#updatesFrame').src)$('#updatesFrame').src='/updates/';if(v==='users'&&!$('#usersFrame').src)$('#usersFrame').src='/users/';if(v==='policies'&&!$('#policiesFrame').src)$('#policiesFrame').src='/policies/';if(v==='files'&&!$('#filesFrame').src)$('#filesFrame').src='/files/';if(v==='devices')loadDevices()}
async function loadOverview(){try{let [d,f]=await Promise.all([api('/api/devices'),api('/api/files')]);$('#deviceCount').textContent=d.devices.length;$('#fileCount').textContent=f.items.length}catch(e){}}
async function loadDevices(){let d=await api('/api/devices');$('#deviceRows').innerHTML=d.devices.map(x=>`<tr><td>${esc(x.name)}<br><small class="muted">${esc(x.device_uid)}</small></td><td>${x.online?'<span class="status">在线</span>':'离线'}</td><td>${x.last_seen?new Date(x.last_seen*1000).toLocaleString():'-'}</td><td><button class="mini" onclick="selectDevice(${x.id},'${escAttr(x.name)}')">选择/执行</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无设备</td></tr>'}
async function installInfo(){let d=await fetch('/api/agent/install-info').then(r=>r.json());$('#installCommand').textContent=d.install_command}function downloadAgent(){location.href='/downloads/device-agent.tar.gz'}
function selectDevice(id,name){selectedDevice=id;$('#selectedDevice').textContent='当前设备：'+name;loadTasks()}
$('#execBtn').onclick=async()=>{if(!selectedDevice)return alert('请先选择设备');let cmd=$('#execCommand').value.trim();if(!cmd)return;await api(`/api/devices/${selectedDevice}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'exec',payload:{command:cmd,timeout:60,shell:true}})});$('#taskOutput').textContent='任务已提交，等待设备领取…';loadTasks();clearInterval(taskTimer);taskTimer=setInterval(loadTasks,2000)};
async function loadTasks(){if(!selectedDevice)return;let d=await api(`/api/devices/${selectedDevice}/tasks`);$('#taskOutput').textContent=JSON.stringify(d.tasks.slice(0,10),null,2);if(d.tasks[0]&&['done','error','timeout'].includes(d.tasks[0].status))clearInterval(taskTimer)}
async function loadFiles(path=''){currentPath=path;let d=await api('/api/files?path='+encodeURIComponent(path));$('#pathBox').value='/'+(d.path||'');$('#fileRows').innerHTML=d.items.map(x=>`<tr><td class="${x.is_dir?'folder':''}" onclick="${x.is_dir?`loadFiles('${escAttr(x.path)}')`:''}">${x.is_dir?'📁':'📄'} ${esc(x.name)}</td><td>${x.is_dir?'-':formatSize(x.size)}</td><td>${new Date(x.mtime*1000).toLocaleString()}</td><td>${x.is_dir?'':`<button class="mini" onclick="downloadFile('${escAttr(x.path)}')">下载</button>`}<button class="mini danger" onclick="deleteFile('${escAttr(x.path)}')">删除</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">目录为空</td></tr>'}
$('#upDir').onclick=()=>loadFiles(currentPath.split('/').slice(0,-1).join('/'));$('#newFolder').onclick=async()=>{let n=prompt('文件夹名称');if(!n)return;await api('/api/files/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:[currentPath,n].filter(Boolean).join('/')})});loadFiles(currentPath)};$('#uploadBtn').onclick=()=>$('#uploadInput').click();$('#uploadInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;await api('/api/files/content?path='+encodeURIComponent([currentPath,f.name].filter(Boolean).join('/')),{method:'PUT',body:f});e.target.value='';loadFiles(currentPath)};
async function deleteFile(p){if(!confirm('确定删除 '+p+'？'))return;await api('/api/files?path='+encodeURIComponent(p),{method:'DELETE'});loadFiles(currentPath)}async function downloadFile(p){let b=await api('/api/files/content?download=1&path='+encodeURIComponent(p));let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.split('/').pop();a.click();URL.revokeObjectURL(a.href)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s).replace(/\\/g,'\\\\').replace(/'/g,'\\&#39;')}function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
installInfo();enter();
</script></body></html>
