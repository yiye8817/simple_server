<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务器文件管理</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:#dce8f5;background:#091321;--line:#294159;--panel:#101e30;--blue:#54abff}*{box-sizing:border-box}body{margin:0;padding:24px;background:#091321}button,input{font:inherit}.wrap{max-width:1200px;margin:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--blue);font-weight:800;cursor:pointer}.danger{background:#e66370;color:white}.path{flex:1;min-width:240px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0b1726;color:#cbd9e6}.table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--panel)}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:#8fa5ba}.folder{color:#76bcff;cursor:pointer}.mini{padding:6px 8px;border:0;border-radius:6px;background:#31506d;color:white;cursor:pointer}.muted{color:#8fa5ba}.hidden{display:none}@media(max-width:700px){body{padding:12px}.table{font-size:12px}th,td{padding:8px}}
</style></head><body><div class="wrap"><h1>服务器文件管理</h1><div class="muted">支持多文件上传、全选和批量删除</div><div class="tools"><button class="btn" id="up">上一级</button><button class="btn" id="mkdir">新建目录</button><button class="btn" id="upload">多文件上传</button><button class="btn danger" id="remove">删除所选</button><input id="picker" class="hidden" type="file" multiple><input id="path" class="path" readonly></div><table class="table"><thead><tr><th><input id="all" type="checkbox"></th><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('devControlToken')||'';let cwd='',selected=new Set();async function api(url,opt={}){opt.headers=Object.assign({Authorization:'Bearer '+token()},opt.headers||{});let r=await fetch(url,opt),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():await r.blob();if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function size(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
async function load(p=''){cwd=p;selected.clear();$('#all').checked=false;let d=await api('/api/files?path='+encodeURIComponent(p));$('#path').value='/'+(d.path||'');$('#rows').innerHTML=d.items.map(x=>`<tr><td><input class="pick" type="checkbox" data-path="${encodeURIComponent(x.path)}"></td><td class="${x.is_dir?'folder':''}" data-open="${x.is_dir?encodeURIComponent(x.path):''}">${x.is_dir?'📁':'📄'} ${esc(x.name)}</td><td>${x.is_dir?'-':size(x.size)}</td><td>${new Date(x.mtime*1000).toLocaleString()}</td><td>${x.is_dir?'':`<button class="mini download" data-path="${encodeURIComponent(x.path)}">下载</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">目录为空</td></tr>';document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>x.dataset.open&&load(decodeURIComponent(x.dataset.open)));document.querySelectorAll('.pick').forEach(x=>x.onchange=()=>toggle(x));document.querySelectorAll('.download').forEach(x=>x.onclick=()=>download(decodeURIComponent(x.dataset.path)))}function toggle(x){let p=decodeURIComponent(x.dataset.path);x.checked?selected.add(p):selected.delete(p)}
$('#all').onchange=e=>document.querySelectorAll('.pick').forEach(x=>{x.checked=e.target.checked;toggle(x)});$('#up').onclick=()=>load(cwd.split('/').slice(0,-1).join('/'));$('#mkdir').onclick=async()=>{let n=prompt('新目录名称');if(!n)return;await api('/api/files/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:[cwd,n].filter(Boolean).join('/')})});load(cwd)};$('#upload').onclick=()=>$('#picker').click();$('#picker').onchange=async e=>{for(let f of e.target.files)await api('/api/files/content?path='+encodeURIComponent([cwd,f.name].filter(Boolean).join('/')),{method:'PUT',body:f});e.target.value='';load(cwd)};$('#remove').onclick=async()=>{let paths=[...selected];if(!paths.length)return alert('请先选择文件或目录');if(!confirm(`确定删除 ${paths.length} 项？目录将递归删除。`))return;let d=await api('/api/files/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths})});if(!d.ok)alert('部分项目删除失败');load(cwd)};
async function download(p){let b=await api('/api/files/content?download=1&path='+encodeURIComponent(p)),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}load();
</script></body></html>
