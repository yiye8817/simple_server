<script>

o|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|namespace|new|nullptr|operator|private|protected|public|return|short|signed|sizeof|static|struct|switch|template|this|throw|true|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while)\b/g,php:/\b(and|array|as|break|case|catch|class|const|continue|declare|default|die|do|echo|else|elseif|empty|enddeclare|endfor|endforeach|endif|endswitch|endwhile|eval|exit|extends|final|finally|fn|for|foreach|function|global|goto|if|implements|include|include_once|instanceof|insteadof|interface|isset|list|match|namespace|new|or|print|private|protected|public|require|require_once|return|static|switch|throw|trait|try|unset|use|var|while|xor|yield)\b/g,ruby:/\b(alias|and|begin|break|case|class|def|defined|do|else|elsif|end|ensure|false|for|if|in|module|next|nil|not|or|redo|rescue|retry|return|self|super|then|true|undef|unless|until|when|while|yield)\b/g,yaml:/\b(true|false|null|yes|no)\b/g};
let cwd='',selected=new Set(),previewUrl=null,thumbUrls=[],layout='grid';
async function api(url,opt={}){opt.headers=Object.assign({Authorization:'Bearer '+token()},opt.headers||{});let r=await fetch(url,opt),ct=r.headers.get('content-type')||'',d=ct.includes('json')?await r.json():await r.blob();if(!r.ok)throw Error((d&&d.error)||'请求失败');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function size(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function revoke(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
function isDrawio(name,kind){return kind==='drawio'||/\.drawio$/i.test(name||'')}
function openDrawio(p){if(window.parent&&window.parent!==window){window.parent.postMessage({source:'dev-control-files',action:'open-drawio',path:p},'*')}else{location.href='/drawio/?extfile='+encodeURIComponent(p)}}
function icon(x){if(x.is_dir)return '📁';if(isDrawio(x.name,x.preview))return '◇';return {image:'🖼',video:'🎬',audio:'🎵',json:'{}',markdown:'MD',code:'</>'}[x.preview]||'📄'}
function updateSelected(){let n=selected.size;$('#selectedCount').textContent=n?n+' 项已选择':'未选择项目';$('#remove').disabled=!n}
function setLayout(){document.body.classList.toggle('layout-grid',layout==='grid');$('#viewToggle').textContent=layout==='grid'?'切换列表':'切换网格'}
function renderGrid(items){$('#fileGrid').innerHTML=items.map(function(x){let p=encodeURIComponent(x.path),k=x.preview||'',thumb=(k==='image'||k==='video')?'<div class="thumb" data-thumb-path="'+p+'" data-thumb-kind="'+k+'"><span>'+icon(x)+'</span></div>':'<div class="thumb"><span>'+icon(x)+'</span></div>';let act=x.is_dir?'打开':(isDrawio(x.name,k)?'Drawio':'预览');return '<article class="file-card" data-open="'+(x.is_dir?p:'')+'" data-preview="'+(x.is_dir?'':p)+'" data-kind="'+esc(k)+'" data-size="'+(x.size||0)+'" data-name="'+esc(x.name)+'"><input class="pick" type="checkbox" data-path="'+p+'">'+thumb+'<div class="file-card-body"><div class="file-card-name" title="'+esc(x.name)+'">'+esc(x.name)+'</div><div class="file-card-meta">'+(x.is_dir?'目录':size(x.size))+'</div><div class="file-card-actions"><button class="mini card-open" data-path="'+p+'" data-kind="'+esc(k)+'" data-dir="'+(x.is_dir?'1':'')+'" data-size="'+(x.size||0)+'" data-name="'+esc(x.name)+'">'+act+'</button>'+(x.is_dir?'':'<button class="mini download" data-path="'+p+'">下载</button>')+'</div></div></article>'}).join('')||'<div class="muted" style="padding:20px">目录为空</div>'}
async function renderThumbs(){thumbUrls.forEach(function(x){URL.revokeObjectURL(x)});thumbUrls=[];for(let el of document.querySelectorAll('[data-thumb-path]')){try{let p=decodeURIComponent(el.dataset.thumbPath),r=await fetch('/api/files/content?preview=1&path='+encodeURIComponent(p),{headers:{Authorization:'Bearer '+token()}});if(!r.ok)continue;let u=URL.createObjectURL(await r.blob());thumbUrls.push(u);el.innerHTML=el.dataset.thumbKind==='video'?'<video muted preload="metadata" src="'+u+'"></video>':'<img loading="lazy" src="'+u+'" alt="">'}catch(e){}}}
function isKw(w,lang){let re=KW[lang];if(!re)return false;re.lastIndex=0;return re.test(w)}
function highlightCode(src,lang){
  let out='',i=0,lineC=lang==='python'||lang==='yaml'||lang==='bash'||lang==='perl';
  const push=(t,cls)=>{out+=cls?`<span class="${cls}">${esc(t)}</span>`:esc(t)};
  const slashC=lang==='javascript'||lang==='typescript'||lang==='java'||lang==='c'||lang==='cpp'||lang==='go'||lang==='rust'||lang==='php'||lang==='css'||lang==='sql';
  while(i<src.length){
    if(lineC&&src[i]==='#'){let j=src.indexOf('\n',i);if(j<0)j=src.length;push(src.slice(i,j),'tok-cm');i=j;continue}
    if(slashC&&src.startsWith('//',i)){let j=src.indexOf('\n',i);if(j<0)j=src.length;push(src.slice(i,j),'tok-cm');i=j;continue}
    if(src.startsWith('/*',i)){let j=src.indexOf('*/',i+2);j=j<0?src.length:j+2;push(src.slice(i,j),'tok-cm');i=j;continue}
    let q=src[i];
    if(q==='"'||q==="'"||q==='`'){let j=i+1;while(j<src.length&&src[j]!==q){if(src[j]==='\\')j++;j++}push(src.slice(i,Math.min(src.length,j+1)),'tok-str');i=Math.min(src.length,j+1);continue}
    if(/[0-9]/.test(src[i])&&(i===0||/[^A-Za-z0-9_]/.test(src[i-1]))){let m=src.slice(i).match(/^\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/);push(m[0],'tok-num');i+=m[0].length;continue}
    if(/[A-Za-z_]/.test(src[i])){let m=src.slice(i).match(/^[A-Za-z_][\w]*/);let w=m[0];push(w,isKw(w,lang)?'tok-kw':'');i+=w.length;continue}
    out+=esc(src[i]);i++;
  }
  return out;
}
function highlightJson(src){
  let pretty=src;
  try{pretty=JSON.stringify(JSON.parse(src),null,2)}catch(e){return '<div class="bad">JSON 无法解析，以下为原文</div><pre class="code">'+esc(src)+'</pre>'}
  let html=esc(pretty).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|\b(true|false|null)\b/g,(m,str,colon,bool)=>{
    if(str)return colon?`<span class="tok-key">${str}</span>${colon}`:`<span class="tok-str">${str}</span>`;
    if(bool)return `<span class="tok-kw">${bool}</span>`;
    return `<span class="tok-num">${m}</span>`;
  });
  return '<pre class="code">'+html+'</pre>';
}
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src){
  const lines=src.replace(/\r\n/g,'\n').split('\n'),html=[];let i=0,para=[];
  const flush=()=>{if(para.length){html.push('<p>'+inlineMd(para.join(' '))+'</p>');para=[]}};
  while(i<lines.length){
    let line=lines[i];
    if(line.startsWith('```')){flush();let lang=line.slice(3).trim().toLowerCase(),buf=[];i++;while(i<lines.length&&!lines[i].startsWith('```')){buf.push(lines[i]);i++}i++;html.push('<pre class="code">'+highlightCode(buf.join('\n'),lang||'javascript')+'</pre>');continue}
    if(/^#{1,4}\s/.test(line)){flush();let n=line.match(/^#+/)[0].length;html.push(`<h${n}>`+inlineMd(line.replace(/^#+\s*/,''))+`</h${n}>`);i++;continue}
    if(/^(-{3,}|\*{3,})$/.test(line.trim())){flush();html.push('<hr>');i++;continue}
    if(/^>\s?/.test(line)){flush();let q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,''));i++}html.push('<blockquote>'+inlineMd(q.join(' '))+'</blockquote>');continue}
    if(/^\s*[-*+]\s/.test(line)){flush();html.push('<ul>');while(i<lines.length&&/^\s*[-*+]\s/.test(lines[i])){html.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*+]\s/,''))+'</li>');i++}html.push('</ul>');continue}
    if(/^\s*\d+\.\s/.test(line)){flush();html.push('<ol>');while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){html.push('<li>'+inlineMd(lines[i].replace(/^\s*\d+\.\s/,''))+'</li>');i++}html.push('</ol>');continue}
    if(/^\|/.test(line)&&i+1<lines.length&&/^\|?\s*:?-+:?\s*\|/.test(lines[i+1])){flush();let head=line.split('|').slice(1,-1);i+=2;html.push('<table><thead><tr>'+head.map(c=>'<th>'+inlineMd(c.trim())+'</th>').join('')+'</tr></thead><tbody>');while(i<lines.length&&/^\|/.test(lines[i])){html.push('<tr>'+lines[i].split('|').slice(1,-1).map(c=>'<td>'+inlineMd(c.trim())+'</td>').join('')+'</tr>');i++}html.push('</tbody></table>');continue}
    if(!line.trim()){flush();i++;continue}
    para.push(line);i++;
  }
  flush();
  return '<div class="md-body">'+(html.join('')||'<p class="muted">空文档</p>')+'</div>';
}
function langOf(name){return LANG[(name||'').includes('.')?('.'+(name.split('.').pop()||'').toLowerCase()):'']||'javascript'}
async function load(p=''){cwd=p;selected.clear();$('#all').checked=false;updateSelected();let d=await api('/api/files?path='+encodeURIComponent(p));$('#path').value='/'+(d.path||'');
renderGrid(d.items);renderThumbs();$('#rows').innerHTML=d.items.map(x=>`<tr><td><input class="pick" type="checkbox" data-path="${encodeURIComponent(x.path)}"></td><td class="${x.is_dir?'folder':'file'}" data-open="${x.is_dir?encodeURIComponent(x.path):''}" data-preview="${x.is_dir?'':encodeURIComponent(x.path)}" data-kind="${esc(x.preview||'')}" data-size="${x.size||0}" data-name="${esc(x.name)}">${icon(x)} ${esc(x.name)}</td><td class="hide-sm">${x.is_dir?'-':size(x.size)}</td><td class="hide-sm">${new Date(x.mtime*1000).toLocaleString()}</td><td>${x.is_dir?'':(isDrawio(x.name,x.preview)?`<button class="mini preview-btn" data-path="${encodeURIComponent(x.path)}" data-kind="drawio" data-size="${x.size||0}" data-name="${esc(x.name)}">用 Drawio 打开</button>`:`<button class="mini preview-btn" data-path="${encodeURIComponent(x.path)}" data-kind="${esc(x.preview||'')}" data-size="${x.size||0}" data-name="${esc(x.name)}">预览</button>`)+` <button class="mini download" data-path="${encodeURIComponent(x.path)}">下载</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">目录为空</td></tr>';
document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{if(x.dataset.open)load(decodeURIComponent(x.dataset.open));else if(x.dataset.preview)openItem(decodeURIComponent(x.dataset.preview),x.dataset.kind,Number(x.dataset.size||0),x.dataset.name)});
document.querySelectorAll('.pick').forEach(x=>{x.onclick=e=>e.stopPropagation();x.onchange=()=>toggle(x)});
document.querySelectorAll('.download').forEach(x=>x.onclick=e=>{e.stopPropagation();download(decodeURIComponent(x.dataset.path))});
document.querySelectorAll('.preview-btn,.card-open').forEach(x=>x.onclick=e=>{e.stopPropagation();let p=decodeURIComponent(x.dataset.path);x.dataset.dir?load(p):openItem(p,x.dataset.kind,Number(x.dataset.size||0),x.dataset.name)})}
function toggle(x){let p=decodeURIComponent(x.dataset.path);x.checked?selected.add(p):selected.delete(p);updateSelected()}
function openItem(p,kind,bytes,name){if(isDrawio(name||p,kind)){openDrawio(p);return}preview(p,kind,bytes,name)}
async function preview(p,kind,bytes,name){revoke();$('#previewTitle').textContent=p.split('/').pop();$('#modal').classList.add('open');$('#previewBody').className='dialog-body';$('#previewBody').innerHTML='<div class="muted">加载中…</div>';
try{
  if(!kind){$('#previewBody').innerHTML='<div class="muted">该类型暂不支持在线预览，请下载后查看。</div>';return}
  if(bytes>PREVIEW_MAX){$('#previewBody').innerHTML='<div class="muted">文件超过 100MB，无法预览，请下载后查看。</div>';return}
  let r=await fetch('/api/files/content?preview=1&path='+encodeURIComponent(p),{headers:{Authorization:'Bearer '+token()}});
  if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'预览失败')}
  if(kind==='json'){$('#previewBody').innerHTML=highlightJson(await r.text());return}
  if(kind==='markdown'){$('#previewBody').innerHTML=renderMarkdown(await r.text());return}
  if(kind==='code'||kind==='text'){$('#previewBody').innerHTML='<pre class="code">'+highlightCode(await r.text(),langOf(name||p))+'</pre>';return}
  let b=await r.blob();previewUrl=URL.createObjectURL(b);$('#previewBody').className='dialog-body center';
  if(kind==='image')$('#previewBody').innerHTML=`<img src="${previewUrl}" alt="">`;
  else if(kind==='pdf')$('#previewBody').innerHTML=`<iframe src="${previewUrl}" title="pdf"></iframe>`;
  else if(kind==='audio')$('#previewBody').innerHTML=`<audio controls src="${previewUrl}"></audio>`;
  else if(kind==='video')$('#previewBody').innerHTML=`<video controls src="${previewUrl}"></video>`;
  else $('#previewBody').innerHTML='<div class="muted">无法预览</div>'}
catch(e){$('#previewBody').innerHTML='<div class="bad">'+esc(e.message)+'</div>'}}
function closeModal(){$('#modal').classList.remove('open');revoke()}
$('#closePreview').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()}
$('#all').onchange=e=>document.querySelectorAll('.pick').forEach(x=>{x.checked=e.target.checked;toggle(x)});$('#viewToggle').onclick=()=>{layout=layout==='grid'?'list':'grid';setLayout()};$('#uploadFab').onclick=()=>$('#picker').click();setLayout();updateSelected();
$('#up').onclick=()=>load(cwd.split('/').slice(0,-1).join('/'));
$('#mkdir').onclick=async()=>{let n=prompt('新目录名称');if(!n)return;await api('/api/files/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:[cwd,n].filter(Boolean).join('/')})});load(cwd)};
$('#upload').onclick=()=>$('#picker').click();
$('#picker').onchange=async e=>{if(!e.target.files.length)return;$('#selectedCount').textContent='上传中…';try{for(let f of e.target.files)await api('/api/files/content?path='+encodeURIComponent([cwd,f.name].filter(Boolean).join('/')),{method:'PUT',body:f})}finally{e.target.value='';load(cwd)}};
$('#remove').onclick=async()=>{let paths=[...selected];if(!paths.length)return alert('请先选择文件或目录');if(!confirm(`确定删除 ${paths.length} 项？目录将递归删除。`))return;let d=await api('/api/files/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths})});if(!d.ok)alert('部分项目删除失败');load(cwd)};
async function download(p){let b=await api('/api/files/content?download=1&path='+encodeURIComponent(p)),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
load().catch(e=>{$('#rows').innerHTML=`<tr><td colspan="5" class="bad">${esc(e.message)}</td></tr>`});
</script></body></html>
