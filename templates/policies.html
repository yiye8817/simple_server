<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景黑白名单</title><style>
:root{font:14px Inter,"Noto Sans SC",system-ui;color:#dce8f5;background:#091321;--line:#294159;--panel:#101e30;--blue:#54abff}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 85% 0,#193d64,transparent 34%),#091321}button,input,textarea{font:inherit}.wrap{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.muted{color:#8ea5ba}.btn{padding:9px 13px;border:0;border-radius:8px;background:var(--blue);color:#07121d;font-weight:800;cursor:pointer}.ghost{background:transparent;color:#dce8f5;border:1px solid var(--line)}.danger{background:#e66370;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:15px;margin-top:22px}.card{padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.card h3{margin:0}.badge{padding:3px 7px;border-radius:12px;background:#173854;color:#8dcbff;font-size:11px}.lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.list{padding:10px;border-radius:9px;background:#091522;min-height:100px}.list strong{display:block;margin-bottom:7px}.items{max-height:120px;overflow:auto;color:#a9bfd2;white-space:pre-wrap}.actions{display:flex;gap:7px}.actions .btn{font-size:12px;padding:7px 9px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#02070dcc;padding:18px}.hide{display:none}.dialog{width:min(680px,100%);padding:23px;border:1px solid var(--line);border-radius:15px;background:#101d2d}.field{display:grid;gap:5px;margin:12px 0}.field input,.field textarea{padding:10px;border:1px solid #36516c;border-radius:8px;background:#091522;color:#fff}.field textarea{min-height:150px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#8ea5ba;border:1px dashed var(--line);border-radius:12px}@media(max-width:650px){body{padding:14px}.cols,.lists{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><h1>场景黑白名单</h1><div class="muted">黑名单优先；存在白名单时，未列入白名单的值默认拒绝</div></div><button class="btn" onclick="openForm()">＋ 新建场景</button></header><section id="grid" class="grid"></section></div>
<div id="modal" class="modal hide"><form id="form" class="dialog"><h2 id="title">新建场景</h2><input id="sid" type="hidden"><label class="field">场景名称<input id="name" required placeholder="例如：llm-model-access"></label><label class="field">使用说明<input id="description" placeholder="说明该名单用于什么场景"></label><div class="cols"><label class="field">白名单（每行一项）<textarea id="white" placeholder="allowed-item-1&#10;allowed-item-2"></textarea></label><label class="field">黑名单（每行一项）<textarea id="black" placeholder="blocked-item-1&#10;blocked-item-2"></textarea></label></div><label><input id="enabled" type="checkbox" checked> 启用场景</label><div class="foot"><button type="button" class="btn ghost" onclick="closeForm()">取消</button><button class="btn">保存</button></div></form></div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('devControlToken')||'',headers=()=>({Authorization:'Bearer '+token(),'Content-Type':'application/json'});let rows=[];
async function api(url,opt={}){opt.headers=Object.assign(headers(),opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{rows=(await api('/api/access-policies/scenarios')).scenarios;render()}catch(e){alert(e.message)}}function render(){$('#grid').innerHTML=rows.map(x=>`<article class="card"><div style="display:flex;justify-content:space-between"><h3>${esc(x.name)}</h3><span class="badge">${x.enabled?'已启用':'已停用'}</span></div><p class="muted">${esc(x.description||'无说明')}</p><div class="lists"><div class="list"><strong>✓ 白名单 (${x.whitelist.length})</strong><div class="items">${x.whitelist.map(esc).join('\n')||'（空，默认允许）'}</div></div><div class="list"><strong>✕ 黑名单 (${x.blacklist.length})</strong><div class="items">${x.blacklist.map(esc).join('\n')||'（空）'}</div></div></div><div class="actions"><button class="btn" onclick="copyApi('${esc(x.name)}')">复制查询 API</button><button class="btn ghost" onclick="openForm(${x.id})">编辑</button><button class="btn danger" onclick="removeItem(${x.id})">删除</button></div></article>`).join('')||'<div class="empty">尚未配置场景</div>'}
function openForm(id){let x=id?rows.find(v=>v.id===id):null;$('#form').reset();$('#sid').value=x?x.id:'';$('#title').textContent=x?'编辑场景':'新建场景';$('#name').value=x?x.name:'';$('#description').value=x?x.description:'';$('#white').value=x?x.whitelist.join('\n'):'';$('#black').value=x?x.blacklist.join('\n'):'';$('#enabled').checked=x?x.enabled:true;$('#modal').classList.remove('hide')}function closeForm(){$('#modal').classList.add('hide')}
$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#sid').value,d={name:$('#name').value.trim(),description:$('#description').value.trim(),whitelist:$('#white').value.split('\n'),blacklist:$('#black').value.split('\n'),enabled:$('#enabled').checked};await api(id?'/api/access-policies/scenarios/'+id:'/api/access-policies/scenarios',{method:id?'PATCH':'POST',body:JSON.stringify(d)});closeForm();load()};async function removeItem(id){if(!confirm('确定删除该场景？'))return;await api('/api/access-policies/scenarios/'+id,{method:'DELETE'});load()}
async function copyApi(name){let text=`GET ${location.origin}/api/access-policies/scenarios/${encodeURIComponent(name)}\nAuthorization: Bearer <token>`;await navigator.clipboard.writeText(text);alert('查询 API 已复制')}load();
</script></body></html>
