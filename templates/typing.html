<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词打字练习</title><style>
:root{font:15px Inter,"Noto Sans SC",system-ui;color:#dce8f5;background:#091321;--line:#284057;--panel:#111f31;--blue:#54abff}*{box-sizing:border-box}body{margin:0;padding:26px;background:radial-gradient(circle at 80% 0,#183a60,transparent 32%),#091321}button,input,select{font:inherit}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.top h1{margin:0 0 5px}.muted{color:#8ea4ba}.settings{display:flex;gap:12px;flex-wrap:wrap}.settings label{display:grid;gap:5px;color:#8ea4ba;font-size:12px}.settings select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#0c1827;color:white}.game{margin-top:24px;padding:36px;border:1px solid var(--line);border-radius:18px;background:#101e30;text-align:center;box-shadow:0 24px 60px #0005}.word{font-size:clamp(42px,8vw,82px);font-weight:800;letter-spacing:3px;margin:28px 0;color:#f3f8fd}.chinese{min-height:32px;font-size:22px;color:#8fcbff;margin-top:-16px;margin-bottom:18px}.pronunciation{min-height:30px;font-size:22px;font-weight:600;letter-spacing:.5px;color:#b8d5ef}.input{width:min(560px,100%);padding:16px 18px;border:2px solid #385a78;border-radius:12px;background:#091522;color:#fff;text-align:center;font-size:24px;outline:none}.input:focus{border-color:var(--blue)}.actions{margin-top:20px}.btn{padding:11px 20px;border:0;border-radius:9px;background:var(--blue);color:#07121e;font-weight:800;cursor:pointer}.stop{background:#ef6b78;color:white}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.metric{padding:13px;border:1px solid var(--line);border-radius:10px;background:#0b1726}.metric strong{display:block;font-size:22px}.progress{height:7px;background:#25384b;border-radius:5px;overflow:hidden;margin-top:18px}.bar{height:100%;width:100%;background:var(--blue);transition:width .1s linear}.feedback{height:28px;margin:13px;font-weight:700}.ok{color:#70dea2}.bad{color:#ff8190}.history{margin-top:22px;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:18px}.history table{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:700px){body{padding:14px}.game{padding:22px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.history{overflow:auto}}
</style></head><body><div class="wrap"><header class="top"><div><h1>⌨ 单词打字练习</h1><div class="muted">词库来源：wordFrequency.xlsx / 1 lemmas</div></div><div class="settings"><label>单词限时<select id="wordLimit"><option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="0">不限</option></select></label><label>练习时长<select id="practiceLimit"><option value="60">1 分钟</option><option value="180">3 分钟</option><option value="300" selected>5 分钟</option><option value="600">10 分钟</option><option value="1800">30 分钟</option><option value="0">不限</option></select></label></div></header>
<section class="game"><div id="sessionTime" class="muted">准备开始</div><div id="word" class="word">Ready</div><div id="chinese" class="chinese">准备开始</div><div id="pronunciation" class="pronunciation"></div><input id="typing" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" disabled placeholder="输入上方单词"><div id="feedback" class="feedback"></div><div class="progress"><div id="bar" class="bar"></div></div><div class="actions"><button id="start" class="btn">开始练习</button> <button id="stop" class="btn stop" hidden>结束练习</button></div><div class="metrics"><div class="metric"><strong id="total">0</strong><span class="muted">总数</span></div><div class="metric"><strong id="correct">0</strong><span class="muted">正确</span></div><div class="metric"><strong id="wrong">0</strong><span class="muted">错误/超时</span></div><div class="metric"><strong id="accuracy">0%</strong><span class="muted">正确率</span></div><div class="metric"><strong id="speed">0</strong><span class="muted">词/分钟</span></div></div></section>
<section class="history"><h3>最近记录</h3><table><thead><tr><th>单词</th><th>输入</th><th>结果</th><th>耗时</th><th>时间</th></tr></thead><tbody id="historyRows"></tbody></table></section></div>
<script>
const $=s=>document.querySelector(s),token=()=>localStorage.getItem('devControlToken')||'';let active=false,current='',wordStart=0,sessionStart=0,sessionId='',wordTimer=null,ticker=null,stats={total:0,correct:0,wrong:0};
async function api(url,opt={}){opt.headers=Object.assign({Authorization:'Bearer '+token()},opt.headers||{});let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function speak(w){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
async function next(){if(!active)return;clearTimeout(wordTimer);let d=await api('/api/typing/word');current=d.word;$('#word').textContent=current;$('#chinese').textContent=d.chinese||'暂无中文释义';$('#pronunciation').textContent=d.pronunciation||'';$('#typing').value='';$('#feedback').textContent='';$('#feedback').className='feedback';wordStart=Date.now();let limit=+$ ('#wordLimit').value;if(limit)wordTimer=setTimeout(()=>finishWord(false,true),limit*1000);$('#typing').focus()}
async function finishWord(correct,timedOut=false){if(!active||!current)return;clearTimeout(wordTimer);let typed=$('#typing').value,elapsed=Date.now()-wordStart,w=current;current='';stats.total++;if(correct){stats.correct++;$('#feedback').textContent='✓ 正确';$('#feedback').className='feedback ok';speak(w)}else{stats.wrong++;$('#feedback').textContent=timedOut?'⌛ 超时：'+w:'✕ 正确答案：'+w;$('#feedback').className='feedback bad'}updateStats();api('/api/typing/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,word:w,typed,correct,timed_out:timedOut,elapsed_ms:elapsed,word_limit_s:+$('#wordLimit').value||null,practice_limit_s:+$('#practiceLimit').value||null})}).catch(console.error);setTimeout(next,correct?120:900)}
$('#typing').addEventListener('input',()=>{if(current&&$('#typing').value.trim().toLowerCase()===current.toLowerCase())finishWord(true,false)});$('#typing').addEventListener('keydown',e=>{if(e.key==='Enter'&&current)finishWord(false,false)});
function updateStats(){let mins=Math.max((Date.now()-sessionStart)/60000,.01);$('#total').textContent=stats.total;$('#correct').textContent=stats.correct;$('#wrong').textContent=stats.wrong;$('#accuracy').textContent=(stats.total?Math.round(stats.correct*100/stats.total):0)+'%';$('#speed').textContent=Math.round(stats.correct/mins)}
function tick(){let elapsed=(Date.now()-sessionStart)/1000,sessionLimit=+$('#practiceLimit').value,wordLimit=+$('#wordLimit').value;if(sessionLimit&&elapsed>=sessionLimit)return stop();$('#sessionTime').textContent=sessionLimit?'练习剩余 '+fmt(sessionLimit-elapsed):'已练习 '+fmt(elapsed);if(wordLimit&&wordStart)$('#bar').style.width=Math.max(0,100-(Date.now()-wordStart)/10/wordLimit)+'%';else $('#bar').style.width='100%';updateStats()}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function start(){active=true;stats={total:0,correct:0,wrong:0};sessionStart=Date.now();sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now());$('#start').hidden=true;$('#stop').hidden=false;$('#typing').disabled=false;$('#wordLimit').disabled=true;$('#practiceLimit').disabled=true;ticker=setInterval(tick,100);next()}
function stop(){active=false;current='';clearTimeout(wordTimer);clearInterval(ticker);$('#typing').disabled=true;$('#start').hidden=false;$('#stop').hidden=true;$('#wordLimit').disabled=false;$('#practiceLimit').disabled=false;$('#word').textContent='Finished';$('#feedback').textContent='本次练习结束';loadHistory()}
$('#start').onclick=start;$('#stop').onclick=stop;
async function loadHistory(){try{let d=await api('/api/typing/history?limit=30');$('#historyRows').innerHTML=d.results.map(x=>`<tr><td>${x.word}</td><td>${x.typed||'-'}</td><td class="${x.correct?'ok':'bad'}">${x.correct?'正确':(x.timed_out?'超时':'错误')}</td><td>${(x.elapsed_ms/1000).toFixed(2)}s</td><td>${new Date(x.created_at*1000).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无记录</td></tr>'}catch(e){$('#historyRows').innerHTML='<tr><td colspan="5">请先登录</td></tr>'}}loadHistory();
</script></body></html>
