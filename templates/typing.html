<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词打字练习</title><style>
:root{font:15px Inter,"Noto Sans SC",system-ui;color:var(--ui-text);background:var(--ui-canvas);--line:var(--ui-line);--panel:var(--ui-surface);--blue:var(--ui-accent)}*{box-sizing:border-box}body{margin:0;padding:26px;background:radial-gradient(circle at 80% 0,var(--ui-accent-soft),transparent 32%),var(--ui-canvas)}button,input,select{font:inherit}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.top h1{margin:0 0 5px}.muted{color:var(--ui-muted)}.settings{display:flex;gap:12px;flex-wrap:wrap}.settings label{display:grid;gap:5px;color:var(--ui-muted);font-size:12px}.settings select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--ui-field);color:var(--ui-text)}.game{margin-top:24px;padding:36px;border:1px solid var(--line);border-radius:18px;background:var(--ui-surface);text-align:center;box-shadow:0 24px 60px rgb(28 50 80 / 5%)}.word{font-size:clamp(42px,8vw,82px);font-weight:800;letter-spacing:3px;margin:28px 0;color:var(--ui-text)}.chinese{min-height:32px;font-size:22px;color:var(--ui-accent);margin-top:-16px;margin-bottom:18px}.pronunciation{min-height:30px;font-size:22px;font-weight:600;letter-spacing:.5px;color:#b8d5ef}.input{width:min(560px,100%);padding:16px 18px;border:2px solid var(--ui-line);border-radius:12px;background:var(--ui-field);color:var(--ui-text);text-align:center;font-size:24px;outline:none}.input:focus{border-color:var(--blue)}.actions{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{padding:11px 20px;border:0;border-radius:9px;background:var(--blue);color:#07121e;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.stop{background:var(--ui-danger);color:var(--ui-text)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.metric{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--ui-field)}.metric strong{display:block;font-size:22px}.progress{height:7px;background:#25384b;border-radius:5px;overflow:hidden;margin-top:18px}.bar{height:100%;width:100%;background:var(--blue);transition:width .1s linear}.feedback{min-height:28px;margin:13px;font-weight:700}.ok{color:var(--ui-success)}.bad{color:var(--ui-danger)}.history{margin-top:22px;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:18px}.history table{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:700px){body{padding:14px}.game{padding:22px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.history{overflow:auto}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='control-ui.css', v='20261025-1') }}">
</head><body class="ui-page ui-typing"><div class="wrap"><header class="top"><div><h1>⌨ 单词打字练习</h1><div class="muted">词库来源：wordFrequency.xlsx / 1 lemmas</div></div><div class="settings"><label>单词限时<select id="wordLimit"><option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="0">不限</option></select></label><label>练习时长<select id="practiceLimit"><option value="60">1 分钟</option><option value="180">3 分钟</option><option value="300" selected>5 分钟</option><option value="600">10 分钟</option><option value="900">15 分钟</option><option value="1200">20 分钟</option><option value="1800">30 分钟</option><option value="0">不限</option></select></label></div></header>
<section class="game"><div id="sessionTime" class="muted">准备开始</div><div id="word" class="word">Ready</div><div id="chinese" class="chinese">准备开始</div><div id="pronunciation" class="pronunciation"></div><input id="typing" class="input" autocomplete="off" autocapitalize="off" enterkeyhint="next" spellcheck="false" disabled placeholder="输入上方单词"><div id="feedback" class="feedback"></div><div class="progress"><div id="bar" class="bar"></div></div><div class="actions"><button id="start" class="btn">开始练习</button> <button id="nextWord" class="btn" hidden>下一个单词</button> <button id="stop" class="btn stop" hidden>结束练习</button></div><div class="metrics"><div class="metric"><strong id="total">0</strong><span class="muted">总数</span></div><div class="metric"><strong id="correct">0</strong><span class="muted">正确</span></div><div class="metric"><strong id="wrong">0</strong><span class="muted">错误/超时</span></div><div class="metric"><strong id="accuracy">0%</strong><span class="muted">正确率</span></div><div class="metric"><strong id="speed">0</strong><span class="muted">词/分钟</span></div></div></section>
<section class="history"><h3>最近记录</h3><table><thead><tr><th>单词</th><th>输入</th><th>结果</th><th>耗时</th><th>时间</th></tr></thead><tbody id="historyRows"></tbody></table></section></div>
<script>
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const token=()=>params.get('access_token')||localStorage.getItem('devControlToken')||'';
let active=false,current='',wordStart=0,sessionStart=0,sessionId='';
let wordTimer=null,ticker=null,nextTimer=null,advancing=false;
let stats={total:0,correct:0,wrong:0};

async function api(url,opt={}){
  opt.headers=Object.assign({Authorization:'Bearer '+token()},opt.headers||{});
  const r=await fetch(url,opt);
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(d.error||('请求失败 '+r.status));
  return d;
}

function speak(w){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-US';
    u.rate=.82;
    speechSynthesis.speak(u);
  }catch(e){}
}

function inputIsCorrect(){
  return !!current && $('#typing').value.trim().toLowerCase()===current.toLowerCase();
}

function clearWordTimer(){
  if(wordTimer){clearTimeout(wordTimer);wordTimer=null;}
}
function clearNextTimer(){
  if(nextTimer){clearTimeout(nextTimer);nextTimer=null;}
}

async function next(){
  if(!active) return;
  clearWordTimer();
  clearNextTimer();
  advancing=false;
  $('#nextWord').disabled=true;
  $('#feedback').textContent='加载中…';
  $('#feedback').className='feedback muted';
  try{
    const d=await api('/api/typing/word');
    current=d.word||'';
    if(!current) throw Error('未获取到单词');
    $('#word').textContent=current;
    $('#chinese').textContent=d.chinese||'暂无中文释义';
    $('#pronunciation').textContent=d.pronunciation||'';
    $('#typing').value='';
    $('#typing').disabled=false;
    $('#nextWord').disabled=false;
    $('#feedback').textContent='';
    $('#feedback').className='feedback';
    wordStart=Date.now();
    const limit=+$('#wordLimit').value;
    if(limit) wordTimer=setTimeout(()=>finishWord(false,true), limit*1000);
    $('#typing').focus();
  }catch(e){
    $('#feedback').textContent='获取单词失败: '+(e.message||e);
    $('#feedback').className='feedback bad';
    $('#nextWord').disabled=false;
  }
}

function finishWord(correct, timedOut=false){
  if(!active || !current || advancing) return;
  advancing=true;
  clearWordTimer();
  clearNextTimer();

  const typed=$('#typing').value;
  const elapsed=Date.now()-wordStart;
  const w=current;
  current='';
  $('#typing').disabled=true;
  $('#nextWord').disabled=true;

  stats.total++;
  if(correct){
    stats.correct++;
    $('#feedback').textContent='✓ 正确';
    $('#feedback').className='feedback ok';
    speak(w);
  }else{
    stats.wrong++;
    $('#feedback').textContent=timedOut?('⌛ 超时：'+w):('✕ 正确答案：'+w);
    $('#feedback').className='feedback bad';
  }
  updateStats();

  api('/api/typing/results',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      session_id:sessionId,
      word:w,
      typed,
      correct,
      timed_out:timedOut,
      elapsed_ms:elapsed,
      word_limit_s:+$('#wordLimit').value||null,
      practice_limit_s:+$('#practiceLimit').value||null
    })
  }).catch(console.error);

  // 正确后稍等再切词,错误/超时稍长一点给用户看答案
  nextTimer=setTimeout(next, correct?350:900);
}

function goNextWord(){
  if(!active || advancing) return;
  clearNextTimer();
  if(current && inputIsCorrect()){
    finishWord(true,false);
  }else if(current){
    // 未拼对也允许跳过,按错误计并切到下一个
    finishWord(false,false);
  }else{
    next();
  }
}

$('#typing').addEventListener('input',()=>{
  if(!active || advancing || !current) return;
  if(inputIsCorrect()){
    // 一旦正确立即结算切词,避免手机输入法后续 input 事件取消定时器
    finishWord(true,false);
  }
});

$('#typing').addEventListener('keydown',e=>{
  if(!active || advancing || !current) return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(inputIsCorrect()) finishWord(true,false);
    else finishWord(false,false);
  }else if((e.key===' '||e.key==='Spacebar') && inputIsCorrect()){
    e.preventDefault();
    finishWord(true,false);
  }
});

function updateStats(){
  const mins=Math.max((Date.now()-sessionStart)/60000,.01);
  $('#total').textContent=stats.total;
  $('#correct').textContent=stats.correct;
  $('#wrong').textContent=stats.wrong;
  $('#accuracy').textContent=(stats.total?Math.round(stats.correct*100/stats.total):0)+'%';
  $('#speed').textContent=Math.round(stats.correct/mins);
}

function tick(){
  const elapsed=(Date.now()-sessionStart)/1000;
  const sessionLimit=+$('#practiceLimit').value;
  const wordLimit=+$('#wordLimit').value;
  if(sessionLimit && elapsed>=sessionLimit) return stop();
  $('#sessionTime').textContent=sessionLimit?('练习剩余 '+fmt(sessionLimit-elapsed)):('已练习 '+fmt(elapsed));
  if(wordLimit && wordStart) $('#bar').style.width=Math.max(0,100-(Date.now()-wordStart)/10/wordLimit)+'%';
  else $('#bar').style.width='100%';
  updateStats();
}

function fmt(s){
  s=Math.max(0,Math.ceil(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function start(){
  active=true;
  advancing=false;
  stats={total:0,correct:0,wrong:0};
  sessionStart=Date.now();
  sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
  $('#start').hidden=true;
  $('#nextWord').hidden=false;
  $('#nextWord').disabled=false;
  $('#stop').hidden=false;
  $('#typing').disabled=false;
  $('#wordLimit').disabled=true;
  $('#practiceLimit').disabled=true;
  ticker=setInterval(tick,100);
  next();
}

function stop(){
  active=false;
  current='';
  advancing=false;
  clearWordTimer();
  clearNextTimer();
  clearInterval(ticker);
  $('#typing').disabled=true;
  $('#start').hidden=false;
  $('#nextWord').hidden=true;
  $('#nextWord').disabled=true;
  $('#stop').hidden=true;
  $('#wordLimit').disabled=false;
  $('#practiceLimit').disabled=false;
  $('#word').textContent='Finished';
  $('#feedback').textContent='本次练习结束';
  loadHistory();
}

$('#start').onclick=start;
$('#nextWord').onclick=goNextWord;
$('#stop').onclick=stop;

async function loadHistory(){
  try{
    const d=await api('/api/typing/history?limit=30');
    $('#historyRows').innerHTML=d.results.map(x=>`<tr><td>${x.word}</td><td>${x.typed||'-'}</td><td class="${x.correct?'ok':'bad'}">${x.correct?'正确':(x.timed_out?'超时':'错误')}</td><td>${(x.elapsed_ms/1000).toFixed(2)}s</td><td>${new Date(x.created_at*1000).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无记录</td></tr>';
  }catch(e){
    $('#historyRows').innerHTML='<tr><td colspan="5">请先登录</td></tr>';
  }
}
loadHistory();
</script></body></html>
